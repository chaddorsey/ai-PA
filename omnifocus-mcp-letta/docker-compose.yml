version: '3.8'

services:
  omnifocus-mcp:
    build: .
    ports:
      - "8124:8124"
    environment:
      - NODE_ENV=production
    volumes:
      # Mount any necessary AppleScript files or configurations
      - ./extra-files:/app/extra-files:ro
    restart: unless-stopped
    networks:
      - omnifocus-network

networks:
  omnifocus-network:
    driver: bridge
