# Series Monitoring Scheduled Jobs
# These jobs extend the existing streaming sync jobs to add series tracking capabilities
# Submit to scheduler for sleeptime agent: agent-a9f2c740-663c-4414-a553-47115180e49b

jobs:
  - title: "Sync All Active Tracked Series"
    description: "Sync episode-level watch progress for all series with tracking_status='watching'. Updates which episodes are watched, in progress, or unwatched for each tracked series."
    schedule:
      cron: "30 4 * * *"
      natural: "Daily at 4:30 AM Eaastern"
    action_type: "agent_message"
    agent_id: "agent-a9f2c740-663c-4414-a553-47115180e49b"
    prompt: "Run sync_all_active_series() for user chad. Log any changes or completions to the tracked_series memory block andthe sync results including count of series synced and any errors to streaming_sync_status memory block. If any errors occur, log details to streaming_sync_errors_and_issues memory block."
    category: "series_monitoring"
    timeout_seconds: 2400
    notes:
      - "Runs after recommendations poll completes"
      - "Each series can take 30-60 seconds to scrape (all seasons/episodes)"
      - "Only syncs series where tracking_status='watching'"
      - "Results are automatically saved to the content database"

  - title: "Reconcile Watchlist Tracking"
    description: "Auto-add series from streaming service watchlists to tracked_series. Ensures new shows added to My List/Watchlist are automatically monitored."
    schedule:
      cron: "30 2 * * *"
      natural: "Daily at 2:30 AM Eastern"
    action_type: "agent_message"
    agent_id: "agent-a9f2c740-663c-4414-a553-47115180e49b"
    prompt: "Run reconcile_watchlist_tracking() for user chad. Update the tracked_series memory block with any additions or changes and log how many new series were auto-tracked from watchlists to streaming_sync_status memory block."
    category: "series_monitoring"
    timeout_seconds: 300
    notes:
      - "Runs after watchlist poll (2:00 AM) to pick up new items"
      - "Only adds series not already tracked"
      - "Sets auto_tracked_from_watchlist=True for these entries"
      - "New series start with tracking_status='watching'"

  - title: "Check for New Seasons"
    description: "Check JustWatch for new season availability on tracked series. Alerts when shows chad watches have new episodes available."
    schedule:
      cron: "0 5 * * 0"
      natural: "Weekly on Sunday at 5:00 AM Eastern"
    action_type: "agent_message"
    agent_id: "agent-a9f2c740-663c-4414-a553-47115180e49b"
    prompt: "Run check_new_seasons() for user chad. If any new seasons are found, log them to streaming_sync_status memory block with the series name and new season number. This helps chad know when shows he watches have new episodes."
    category: "series_monitoring"
    timeout_seconds: 600
    notes:
      - "Checks series with tracking_status 'watching' or 'finished'"
      - "Updates watch_status to 'in_progress' when new seasons found"
      - "Weekly is sufficient since new seasons don't drop frequently"
      - "Uses JustWatch API for availability data"

  - title: "Refresh Streaming Sessions"
    description: "Proactively refresh streaming service sessions before they expire to prevent scraping failures."
    schedule:
      cron: "0 1 * * 0,3"
      natural: "Twice weekly on Sunday and Wednesday at 1:00 AM Eastern"
    action_type: "http_request"
    endpoint: "http://watch-history-service:5127/sessions/refresh-due"
    method: "POST"
    category: "session_maintenance"
    timeout_seconds: 300
    notes:
      - "Runs before any scraping jobs to ensure sessions are fresh"
      - "Uses /sessions/refresh-due endpoint which checks all services"
      - "Only refreshes sessions approaching expiry (based on service-specific thresholds)"
      - "If refresh fails, session will show as 'needs_login' requiring manual capture"
      - "Session durations: Netflix ~7d, Hulu ~30d, Max ~30d, Prime ~30d, Apple ~14d"

  - title: "Clean Browser State Files"
    description: "Weekly cleanup of browser state files to remove bloated localStorage data that can cause JSON parsing errors."
    schedule:
      cron: "30 0 * * 0"
      natural: "Weekly on Sunday at 12:30 AM Eastern"
    action_type: "http_request"
    endpoint: "http://watch-history-service:5127/sessions/cleanup-states"
    method: "POST"
    category: "session_maintenance"
    timeout_seconds: 60
    notes:
      - "Removes localStorage from browser state files (keeps cookies)"
      - "Prevents JSON parsing errors from corrupted control characters"
      - "Runs before session refresh to ensure clean state"
      - "Endpoint needs to be implemented in watch-history-service"

metadata:
  version: "1.0"
  created: "2026-01-06"
  description: "Series monitoring scheduled jobs to extend streaming sync capabilities"
  sleeptime_agent_id: "agent-a9f2c740-663c-4414-a553-47115180e49b"
  
  prerequisite_jobs:
    - "Watchlists Poll (2:00 AM) - required before Reconcile Watchlist Tracking"
    - "Recommendations Poll (4:00 AM) - required before Sync All Active Series"
  
  memory_blocks_used:
    - name: "streaming_sync_status"
      purpose: "Log of sync times, item counts, and new season alerts"
    - name: "streaming_sync_errors_and_issues"
      purpose: "Log of sync errors and credentials needing refresh"
    - name: "tracked_series"
      purpose: "List of tracked series marked 'watching' or 'in_progress'with their current progress, including number of seasons and episodes remaining in the series."
  
  tool_requirements:
    - tool: "sync_all_active_series"
      status: "registered"
    - tool: "reconcile_watchlist_tracking"
      status: "registered"
    - tool: "check_new_seasons"
      status: "registered"
    - tool: "check_credential_status"
      status: "needs re-registration"
      action: "Run register_sports_media_tools.py to attach to sleeptime agent"

  complete_daily_schedule:
    - time: "12:30 AM Sun"
      job: "Clean Browser State Files"
      status: "NEW (weekly)"
    - time: "1:00 AM Sun/Wed"
      job: "Refresh Streaming Sessions"
      status: "NEW (twice weekly)"
    - time: "2:00 AM"
      job: "Watchlists Poll"
      status: "existing"
    - time: "2:30 AM"
      job: "Reconcile Watchlist Tracking"
      status: "NEW"
    - time: "3:00 AM"
      job: "Full Streaming Data Sync"
      status: "existing"
    - time: "4:00 AM"
      job: "Recommendations Poll"
      status: "existing"
    - time: "4:30 AM"
      job: "Sync All Active Tracked Series"
      status: "NEW"
    - time: "Every 6h"
      job: "Watch History Poll"
      status: "existing"
    - time: "Sunday 5:00 AM"
      job: "Check for New Seasons"
      status: "NEW (weekly)"
  
  session_maintenance_notes:
    - "Sessions are stored in /app/credentials/browser_states/{service}_state.json"
    - "Cookies are preserved across container restarts via Docker volume"
    - "If a session shows 'needs_login', manual capture is required"
    - "Manual capture command: curl -X POST http://localhost:5127/sessions/capture/{service}"
    - "This opens a browser window for manual login - must be run on a machine with display"

