[tool.poetry]
name = "scheduler-mcp"
version = "0.1.0"
description = "MCP server exposing scheduler service tools"
authors = ["AI Agent <ai-agent@example.com>"]
include = ["src/scheduler_mcp/*.py"]

[tool.poetry.scripts]
scheduler-mcp = "scheduler_mcp.main:main"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = ">=0.31.1" }
httpx = "^0.27.2"
pydantic = "^2.9.2"
pydantic-settings = "^2.4.0"
structlog = "^24.1.0"
tenacity = "^9.0.0"
mcp = "^1.17.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.9"
mypy = "^1.11.1"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"


