[tool.poetry]
name = "mc-cli"
version = "0.1.0"
description = "Agent-first CLI for Mission Control local-mode ops: laptop SSH, widget queue, resource staging, GitHub stars. Wraps the bespoke Python tools from letta/mc-tools/."
authors = ["ai-PA"]
packages = [{include = "mc_cli", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1"

[tool.poetry.scripts]
mc = "mc_cli.cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
