<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PA Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=26">
    <!-- Marked.js for markdown rendering (pinned to v9 for stable API) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
</head>
<body>
    <div class="page-layout">
        <!-- Phase 2: Conversation switcher rail (left) -->
        <button id="conversation-rail-toggle" class="conversation-rail-toggle">
            <span class="rail-toggle-label">CONVS</span>
        </button>
        <aside id="conversation-rail" class="conversation-rail">
            <div class="conv-rail-header">
                <span class="conv-rail-title">Conversations</span>
                <button id="conv-new-btn" class="conv-new-btn" title="New conversation">+</button>
                <button id="conv-rail-close" class="conv-rail-close" title="Close">&times;</button>
            </div>
            <div id="conv-list" class="conv-list"></div>
        </aside>

        <div class="container">
            <header>
                <h1>Personal Assistant</h1>
                <div class="header-controls">
                    <select id="agent-select">
                        <option value="">Loading agents...</option>
                    </select>
                    <div class="mc-model-status" id="mc-model-status">
                        <span class="model-dot" id="model-dot"></span>
                        <select id="mc-model-select" title="MC Model">
                            <option value="">...</option>
                        </select>
                        <select id="mc-reasoning-select" title="Reasoning Effort">
                            <option value="low">low</option>
                            <option value="medium">med</option>
                            <option value="high">high</option>
                        </select>
                        <span class="oauth-ready-badge" id="oauth-ready-badge" style="display:none">OAuth available</span>
                    </div>
                </div>
            </header>

            <div id="usage-bar" class="usage-bar" style="display:none">
                <span id="usage-text"></span>
            </div>

            <main class="chat-container">
                <div id="messages" class="messages"></div>
            </main>

            <div id="reply-indicator" class="reply-indicator">
                <span class="reply-to-text">
                    Replying to <span class="agent-name"></span>
                </span>
                <button class="clear-reply-btn" title="Clear reply">&times;</button>
            </div>

            <footer class="input-area">
                <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
                <button id="send-btn">Send</button>
            </footer>
        </div>

        <!-- Sidebar toggle tab -->
        <button id="sidebar-toggle" class="sidebar-toggle">
            <span class="sidebar-toggle-label" id="sidebar-toggle-label">TASKS</span>
            <span id="sidebar-badge" class="task-badge"></span>
        </button>

        <!-- Task Review Sidebar -->
        <aside id="task-sidebar" class="task-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-tabs">
                    <button class="sidebar-tab active" data-tab="tasks">
                        Tasks <span id="tasks-tab-count" class="tab-count"></span>
                    </button>
                    <button class="sidebar-tab" data-tab="drafts">
                        Follow-Ups <span id="drafts-tab-count" class="tab-count"></span>
                    </button>
                </div>
                <button class="sidebar-close-btn">&times;</button>
            </div>
            <div id="task-list" class="task-list"></div>
            <div id="draft-list" class="task-list" style="display:none"></div>
            <!-- Schedule panel (inline, card-styled) -->
            <div id="schedule-panel" class="sched-panel">
                <div class="sched-panel-header">
                    <span class="sched-panel-title">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 4v4.5l3 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        Schedule Send
                    </span>
                    <button class="sched-panel-close" id="schedule-cancel-x">&times;</button>
                </div>
                <div class="sched-preview" id="schedule-preview"></div>
                <div class="sched-quick">
                    <button class="sched-quick-btn" data-hour="5" data-min="30">
                        <span class="sqb-time">5:30<span class="sqb-ish">ish</span></span>
                        <span class="sqb-day">Tomorrow</span>
                    </button>
                    <button class="sched-quick-btn" data-hour="8" data-min="0">
                        <span class="sqb-time">8<span class="sqb-ish">ish</span></span>
                        <span class="sqb-day">Tomorrow</span>
                    </button>
                    <button class="sched-quick-btn" data-hour="9" data-min="0">
                        <span class="sqb-time">9<span class="sqb-ish">ish</span></span>
                        <span class="sqb-day">Tomorrow</span>
                    </button>
                </div>
                <div class="sched-custom">
                    <label class="sched-custom-label">Choose a Time</label>
                    <div class="sched-pickers">
                        <input type="date" id="schedule-date" class="sched-input" />
                        <input type="time" id="schedule-time" class="sched-input" />
                    </div>
                </div>
                <div class="sched-panel-footer">
                    <button class="sched-panel-btn sched-panel-cancel" id="schedule-cancel-btn">Cancel</button>
                    <button class="sched-panel-btn sched-confirm-btn" id="schedule-confirm-btn" disabled>Schedule</button>
                </div>
            </div>
            <div id="bulk-actions-bar" class="bulk-actions-bar">
                <span class="bulk-count"></span>
                <button id="bulk-reject-btn" class="bulk-btn bulk-btn-reject">Reject Selected</button>
                <button id="bulk-merge-btn" class="bulk-btn bulk-btn-merge">Merge</button>
            </div>
        </aside>
    </div>

    <!-- OmniFocus Project Picker Dialog -->
    <div id="of-dialog-overlay" class="dialog-overlay">
        <div class="dialog of-dialog">
            <div class="dialog-header">
                <h3>Add to OmniFocus</h3>
                <button class="dialog-close" id="of-dialog-cancel">&times;</button>
            </div>
            <div class="of-dialog-task-edit-wrap">
                <label class="of-dialog-edit-label">Task name</label>
                <textarea id="of-dialog-task-input" class="of-dialog-task-input" rows="2"></textarea>
            </div>
            <div class="of-dialog-estimate" id="of-dialog-estimate" style="display:none"></div>
            <a class="of-inbox-link" id="of-inbox-btn">Add to Inbox (no project)</a>
            <div id="of-tree" class="of-tree"></div>
            <div class="dialog-footer">
                <span class="of-selected-project">No project selected</span>
                <div class="dialog-footer-buttons">
                    <button class="dialog-btn dialog-btn-cancel" id="of-dialog-cancel-btn">Cancel</button>
                    <button class="dialog-btn dialog-btn-confirm" id="of-dialog-confirm-btn" disabled>Confirm</button>
                    <button class="dialog-btn dialog-btn-go" id="of-dialog-go-btn" disabled title="Create task and queue it for the timer widget">Add &amp; Go</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Merge Dialog -->
    <div id="merge-dialog-overlay" class="dialog-overlay">
        <div class="dialog merge-dialog">
            <div class="dialog-header">
                <h3>Merge Tasks</h3>
                <button class="dialog-close" id="merge-dialog-cancel">&times;</button>
            </div>
            <textarea id="merge-description" class="merge-textarea" rows="4" placeholder="Merged task description..."></textarea>
            <div class="dialog-footer">
                <div class="dialog-footer-buttons">
                    <button class="dialog-btn dialog-btn-cancel" id="merge-cancel-btn">Cancel</button>
                    <button class="dialog-btn dialog-btn-confirm" id="merge-confirm-btn">Merge Tasks</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Draft Edit Dialog -->
    <div id="draft-edit-overlay" class="dialog-overlay">
        <div class="dialog draft-edit-dialog">
            <div class="dialog-header">
                <h3>Edit Draft</h3>
                <button class="dialog-close" id="draft-edit-cancel">&times;</button>
            </div>
            <div class="draft-edit-fields">
                <label class="draft-field-label">
                    <span>To</span>
                    <input type="text" id="draft-edit-to" class="draft-field-input" placeholder="recipient@example.com" />
                </label>
                <label class="draft-field-label">
                    <span>Cc</span>
                    <input type="text" id="draft-edit-cc" class="draft-field-input" placeholder="cc@example.com" />
                </label>
                <label class="draft-field-label">
                    <span>Subject</span>
                    <input type="text" id="draft-edit-subject" class="draft-field-input" />
                </label>
                <div class="draft-toolbar">
                    <button type="button" class="tb-btn" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
                    <button type="button" class="tb-btn" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
                    <button type="button" class="tb-btn" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
                    <span class="tb-sep"></span>
                    <button type="button" class="tb-btn" data-cmd="insertUnorderedList" title="Bullet list">&#8226;</button>
                    <button type="button" class="tb-btn" data-cmd="insertOrderedList" title="Numbered list">1.</button>
                    <span class="tb-sep"></span>
                    <button type="button" class="tb-btn" data-cmd="createLink" title="Insert link">&#128279;</button>
                    <button type="button" class="tb-btn" data-cmd="removeFormat" title="Clear formatting">&#8999;</button>
                </div>
                <div id="draft-edit-body" class="draft-edit-body" contenteditable="true" role="textbox" aria-multiline="true"></div>
            </div>
            <!-- Inline schedule section (toggled by Schedule button) -->
            <div id="draft-edit-schedule" class="draft-edit-schedule" style="display:none">
                <div class="sched-section-divider">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 4v4.5l3 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Schedule Send
                </div>
                <div class="sched-quick sched-quick-inline">
                    <button class="sched-quick-btn" data-hour="5" data-min="30">
                        <span class="sqb-time">5:30<span class="sqb-ish">ish</span></span>
                        <span class="sqb-day">Tomorrow</span>
                    </button>
                    <button class="sched-quick-btn" data-hour="8" data-min="0">
                        <span class="sqb-time">8<span class="sqb-ish">ish</span></span>
                        <span class="sqb-day">Tomorrow</span>
                    </button>
                    <button class="sched-quick-btn" data-hour="9" data-min="0">
                        <span class="sqb-time">9<span class="sqb-ish">ish</span></span>
                        <span class="sqb-day">Tomorrow</span>
                    </button>
                </div>
                <div class="sched-custom sched-custom-inline">
                    <label class="sched-custom-label">Choose a Time</label>
                    <div class="sched-pickers">
                        <input type="date" id="draft-sched-date" class="sched-input" />
                        <input type="time" id="draft-sched-time" class="sched-input" />
                        <button class="dialog-btn sched-confirm-btn" id="draft-sched-confirm" disabled>Schedule</button>
                    </div>
                </div>
            </div>
            <div id="draft-edit-error" class="draft-edit-error" style="display:none"></div>
            <div class="dialog-footer">
                <div class="dialog-footer-buttons">
                    <button class="dialog-btn dialog-btn-cancel" id="draft-edit-cancel-btn">Cancel</button>
                    <button class="dialog-btn dialog-btn-confirm" id="draft-edit-save-btn">Save Draft</button>
                    <button class="dialog-btn draft-schedule-btn" id="draft-edit-schedule-btn"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 4v4.5l3 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Schedule</button>
                    <button class="dialog-btn draft-send-btn" id="draft-edit-send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Phase 2: floating undo toast container (absolutely positioned) -->
    <div id="undo-toast-container" class="undo-toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
    <script src="{{ url_for('static', filename='js/sidebar.js') }}?v=3"></script>
    <script src="{{ url_for('static', filename='js/drafts.js') }}?v=1"></script>
    <script src="{{ url_for('static', filename='js/conversation_rail.js') }}?v=1"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}?v=27"></script>
    <script>
    // MC Model Status & Switcher
    (function() {
        const dot = document.getElementById('model-dot');
        const modelSelect = document.getElementById('mc-model-select');
        const reasoningSelect = document.getElementById('mc-reasoning-select');
        const oauthBadge = document.getElementById('oauth-ready-badge');
        let currentLabel = '';
        let presetReasoning = {};

        function updateDotColor(provider) {
            if (provider === 'chatgpt_oauth') {
                dot.style.background = '#34C759';
                dot.title = 'OAuth (free)';
            } else {
                dot.style.background = '#FF9500';
                dot.title = 'API (paid)';
            }
        }

        function updateReasoningOptions(presetName, currentEffort) {
            const options = presetReasoning[presetName] || [];
            reasoningSelect.innerHTML = '';
            if (options.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = 'n/a';
                reasoningSelect.appendChild(opt);
                reasoningSelect.disabled = true;
            } else {
                reasoningSelect.disabled = false;
                options.forEach(level => {
                    const opt = document.createElement('option');
                    opt.value = level;
                    opt.textContent = level;
                    if (level === currentEffort) opt.selected = true;
                    reasoningSelect.appendChild(opt);
                });
            }
        }

        async function fetchModelStatus() {
            try {
                const resp = await fetch('/api/mc-model');
                const data = await resp.json();
                if (data.error) return;

                currentLabel = data.label;
                presetReasoning = data.preset_reasoning || {};
                updateDotColor(data.provider);

                // Populate model dropdown
                modelSelect.innerHTML = '';
                (data.presets || []).forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    if (name === currentLabel) opt.selected = true;
                    modelSelect.appendChild(opt);
                });

                // Update reasoning options for current model
                updateReasoningOptions(currentLabel, data.reasoning_effort);

                // Show "OAuth available" badge when on fallback and oauth is ready
                const onOauth = data.provider === 'chatgpt_oauth';
                if (!onOauth && data.oauth_available) {
                    oauthBadge.style.display = '';
                } else {
                    oauthBadge.style.display = 'none';
                }
            } catch (e) {
                console.error('MC model fetch error:', e);
            }
        }

        modelSelect.addEventListener('change', async () => {
            const preset = modelSelect.value;
            if (!preset) return;
            dot.style.background = '#999';
            try {
                const resp = await fetch('/api/mc-model', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({preset})
                });
                const data = await resp.json();
                if (data.error) {
                    alert('Switch failed: ' + data.error);
                    fetchModelStatus();
                } else {
                    currentLabel = data.label || preset;
                    updateDotColor(data.provider);
                    // Update reasoning options for the new model
                    const defaultEffort = (presetReasoning[preset] || [])[0] || '';
                    updateReasoningOptions(preset, data.reasoning_effort || defaultEffort);
                }
            } catch (e) {
                alert('Switch error: ' + e.message);
                fetchModelStatus();
            }
        });

        reasoningSelect.addEventListener('change', async () => {
            const effort = reasoningSelect.value;
            try {
                const resp = await fetch('/api/mc-reasoning', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({effort})
                });
                const data = await resp.json();
                if (data.error) {
                    alert('Reasoning switch failed: ' + data.error);
                    fetchModelStatus();
                }
            } catch (e) {
                alert('Reasoning error: ' + e.message);
                fetchModelStatus();
            }
        });

        fetchModelStatus();
        setInterval(fetchModelStatus, 30000);
    })();

    // Usage stats — fetch after each message
    (function() {
        const bar = document.getElementById('usage-bar');
        const text = document.getElementById('usage-text');

        function formatTokens(n) {
            if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
            return n.toString();
        }

        window.fetchUsageStats = async function() {
            try {
                const resp = await fetch('/api/mc-usage');
                const data = await resp.json();
                if (data.error) { bar.style.display = 'none'; return; }

                const cacheCls = data.cache_pct >= 75 ? 'cache-high' :
                                 data.cache_pct >= 50 ? 'cache-mid' :
                                 data.cache_pct >= 25 ? 'cache-low' :
                                 data.cache_pct > 0 ? 'cache-poor' :
                                 'cache-none';

                text.innerHTML =
                    `<span>prompt: ${formatTokens(data.prompt_tokens)}</span>` +
                    `<span class="${cacheCls}">cache: ${data.cache_pct}% (${formatTokens(data.cached_tokens)})</span>` +
                    `<span>completion: ${formatTokens(data.completion_tokens)}</span>` +
                    (data.reasoning_tokens > 0 ? `<span>reasoning: ${formatTokens(data.reasoning_tokens)}</span>` : '') +
                    `<span>$${data.spend.toFixed(4)}</span>` +
                    `<span>${data.model}</span>`;

                bar.style.display = 'flex';
            } catch (e) {
                bar.style.display = 'none';
            }
        };

        // Fetch on load and hook into message send
        window.fetchUsageStats();

        // Poll every 10s to catch updates (will be replaced by post-message hook)
        setInterval(window.fetchUsageStats, 10000);
    })();
    </script>
</body>
</html>
