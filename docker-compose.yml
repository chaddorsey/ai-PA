        condition: service_healthy
    environment:
      - PA_ROUTING_LETTA_BASE_URL=http://letta:8283
      - PA_ROUTING_DEFAULT_AGENT_ID=${PA_ROUTING_DEFAULT_AGENT_ID:-}
      - PA_ROUTING_POSTGRES_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      - PA_ROUTING_LOG_LEVEL=INFO
      # Session persistence and conversation lookup
      - SUPABASE_URL=http://supabase-rest:3000
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - PA_ROUTING_DEFAULT_IDENTITY_ID=${PA_ROUTING_DEFAULT_IDENTITY_ID:-}
    ports:
      - "5201:5201"
    volumes:
      - ./docs/task-types:/app/docs/task-types:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5201/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "service=pa-routing-handler"
      - "component=routing"
      - "network=pa-internal"

  gws-bridge:
    build:
      context: ./gws-bridge
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: gws-bridge
    restart: unless-stopped
    networks: [pa-internal]
    environment:
      - GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE=/root/.gws/credentials.json
      - PORT=8098
    volumes:
      - ./gws-bridge/credentials.json:/root/.gws/credentials.json:ro
    ports:
      - "8098:8098"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8098/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "service=gws-bridge"
      - "component=gmail"
      - "network=pa-internal"

  pa-web-ui:
    build:
      context: ./pa-web-ui
      dockerfile: Dockerfile
    container_name: pa-web-ui
    restart: unless-stopped
    networks: [pa-internal]
    depends_on:
      pa-routing-handler:
        condition: service_healthy
      letta:
        condition: service_healthy
      supabase-db:
        condition: service_healthy
      gws-bridge:
        condition: service_healthy
    environment:
      - PA_ROUTING_HANDLER_URL=http://pa-routing-handler:5201
      - LETTA_BASE_URL=http://letta:8283
      - PORT=5200
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      - GWS_BRIDGE_URL=http://gws-bridge:8098
      - MISSION_CONTROL_AGENT_ID=${MISSION_CONTROL_AGENT_ID:-agent-90b2e860-6345-49a7-98f1-8d5ae4d9c4ef}
      - LETTABOT_API_URL=http://host.docker.internal:8080
      - LETTABOT_API_KEY=${LETTABOT_API_KEY:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - OMNIFOCUS_BRIDGE_URL=http://host.docker.internal:8889
      - FOLLOWUP_QUEUE=/data/timer-logs/pending-followups.jsonl
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_USER_TOKEN=${SLACK_MCP_XOXP_TOKEN}
    volumes:
      - ./pa-web-ui/static:/app/static
      - ./omnifocus-timer/logs:/data/timer-logs
    ports:
      - "5200:5200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "service=pa-web-ui"
      - "component=web-interface"
      - "network=pa-internal"
      - "external-access=true"

  # --- Entity Extraction Backfill ---
  entity-backfill-service:
    build: ./entity-backfill-service
    container_name: entity-backfill-service
    restart: unless-stopped
    networks: [pa-internal]
    depends_on:
      drive-rag-service:
        condition: service_healthy
    ports:
      - "5140:8000"
    environment:
      - SUPABASE_REST_URL=http://supabase-rest:3000
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - NEO4J_HTTP_URL=http://neo4j:7474
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=demodemo
    volumes:
      - entity-backfill-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "service=entity-backfill-service"
      - "component=batch-processing"
      - "network=pa-internal"

  # --- Curator Radar: GitHub star overlap monitoring ---
  curator-radar:
    build:
      context: .
      dockerfile: curator-radar/Dockerfile
    container_name: curator-radar
    restart: unless-stopped
    networks: [pa-internal]
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://curator_radar:curator_radar_secret@supabase-db:5432/curator_radar"
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_USERNAME: "chaddorsey"
      TOP_CURATORS_K: "20"
      SLACKBOT_NOTIFY_URL: "http://slackbot:8081/api/notify"
      SLACK_USER_ID: "${SLACK_USER_ID:-U02V91KU8}"
      SMAUG_CONFIG_PATH: "/app/smaug-config/smaug.config.json"
      SMAUG_DATA_PATH: "/app/smaug-data"
      TWITTER_LIST_NAME: "Key Peeps"
      TWITTER_LIST_SIZE: "50"
    volumes:
      - ./smaug/smaug.config.json:/app/smaug-config/smaug.config.json:ro
      - ./smaug-data:/app/smaug-data:ro
    ports:
      - "5145:5145"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5145/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s


volumes:
  supabase_db:
    external: true
    name: ai-pa_supabase_db
  n8n_data:
    name: ai-pa_n8n_data
  n8n_data_test:
  neo4j_data:
  neo4j_logs:
  open-webui:  
  users_cache:
  channels_cache:
  slackbot_state:
  slackbot_logs:
  rag-mcp-data:
  portainer_data:
  sports-service-data:
  schedules-direct-data:
  content-database-data:
  watch-history-credentials:
  entity-backfill-data:
  task-completion-data:

# --- Monitoring and Logging Configuration ---
# All services use standardized logging and labeling for unified monitoring

networks:
  pa-internal:
    name: pa-internal
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "1500"
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    labels:
      - "project=pa-ecosystem"
      - "environment=production"
      - "security=internal-only"

