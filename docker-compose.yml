version: "3.9"

services:
  # --- Database Layer ---
  supabase-db:
    image: supabase/postgres:15.8.1.060
    container_name: supabase-db
    restart: unless-stopped
#    ports:
#      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - supabase_db:/var/lib/postgresql/data
    networks: [pa-internal]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "service=supabase-db"
      - "component=database"
      - "network=pa-internal"

  # --- Supabase Services ---
  supabase-rest:
    image: postgrest/postgrest:v12.2.12
    depends_on: 
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_SCHEMA: public,pa_web,rag,analytics
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: false
    ports:
      - "8000:3000"
    networks: [pa-internal]
    healthcheck:
      test: ["CMD", "pgrep", "postgrest"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  supabase-auth:
    image: supabase/gotrue:v2.177.0
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres
      API_EXTERNAL_URL: http://localhost:8000
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: "http://localhost:3000,http://localhost:8080"
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: false
      GOTRUE_EXTERNAL_EMAIL_ENABLED: true
    ports:
      - "9999:9999"
    networks: [pa-internal]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  supabase-realtime:
    image: supabase/realtime:v2.34.47
    depends_on:
      supabase-db:
        condition: service_healthy
    networks: [pa-internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  supabase-meta:
    image: supabase/postgres-meta:v0.91.0
    container_name: supabase-meta
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8081:8080"
    networks: [pa-internal]

  supabase-studio:
    image: supabase/studio:2025.06.30-sha-6f5982d
    container_name: supabase-studio
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-meta:
        condition: service_healthy
      supabase-auth:
        condition: service_healthy
      supabase-rest:
        condition: service_healthy
    environment:
      # URL Studio uses to connect to Postgres directly
      SUPABASE_DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres

      # Where Studio finds Postgres Meta (schema/foreign key info)
      STUDIO_PG_META_URL: http://supabase-meta:8080

      # RESTful entrypoint via REST service
      SUPABASE_URL: http://supabase-rest:3000

      # Keys (must be in your .env)
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}

      # Pass Postgres password explicitly as well
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "3000:3000"
    networks: [pa-internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- Workflow Automation (n8n) ---
  n8n:
    image: docker.n8n.io/n8nio/n8n  # No version pin - use latest like working reference
    container_name: n8n
    restart: unless-stopped
    networks: [pa-internal]
    depends_on:
      supabase-db:
        condition: service_healthy
    ports:
      - "5678:5678"  # Expose n8n web interface
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5678/healthz', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      # Database configuration - match working reference
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: supabase-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: n8n  # Use dedicated n8n user like working reference
      DB_POSTGRESDB_PASSWORD: n8n_dev_password  # Use n8n-specific password
      DB_POSTGRESDB_SCHEMA: public
      
      # Timezone configuration - match working reference
      GENERIC_TIMEZONE: "America/New_York"
      TZ: "America/New_York"
      
      # Working reference settings
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      
      # Security configuration
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      
      # HYBRID APPROACH: Internal HTTP routing for MCP/webhooks
      N8N_HOST: "0.0.0.0"  # Bind to all interfaces for internal access
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"  # Use HTTP internally like working reference
      WEBHOOK_URL: "http://n8n:5678"  # Internal container URL for MCP/webhooks
      
      # External access still available via Cloudflare tunnel (HTTPS)
      # Tunnel routes https://n8n.cd-ai-pa.work -> http://n8n:5678
      
      # OAuth callback URL configuration - n8n uses EDITOR_BASE_URL to generate OAuth redirect URLs
      N8N_EDITOR_BASE_URL: "https://n8n.cd-ai-pa.work"
    volumes:
      - n8n_data:/home/node/.n8n
      - /tmp/granola-to-letta:/tmp/granola-notes


  # --- Neo4j for Graphiti ---
  neo4j:
    image: neo4j:5.26
    container_name: graphiti-neo4j
    restart: unless-stopped
    networks: [pa-internal]
    environment:
      - NEO4J_AUTH=neo4j/demodemo
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --- Redis (required by Letta for background streaming) ---
  redis:
    image: redis:alpine
    container_name: pa-redis
    restart: unless-stopped
    networks: [pa-internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- Graphiti MCP Server ---
  graphiti-mcp-server:
    build:
      context: ./graphiti/mcp_server
    container_name: graphiti-mcp-server
    user: root
    restart: unless-stopped
    networks: [pa-internal]
    depends_on:
      neo4j:
        condition: service_healthy
    working_dir: /app
    entrypoint: ["/root/.local/bin/uv","run","graphiti_http_wrapper.py"]
    ports:
      - "8082:8000"  # Map external 8082 to internal 8000
    environment:
      # Common MCP variables
      - MCP_SERVER_NAME=graphiti-tools
      - MCP_SERVER_VERSION=1.0.0
      - MCP_SERVER_DESCRIPTION=Graphiti memory and knowledge graph tools
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8000
      - MCP_SERVER_PATH=/mcp
      - MCP_LOG_LEVEL=INFO
      - MCP_LOG_FORMAT=json
      - MCP_HEALTH_CHECK_PATH=/health
      
      # Graphiti-specific variables
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-test-key}
      - MODEL_NAME=${MODEL_NAME:-gpt-4.1-mini}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=demodemo
      - GRAPHITI_TELEMETRY_ENABLED=false
      - GRAPHITI_USE_CUSTOM_ENTITIES=true
      - GRAPHITI_ENTITY_TYPE_SET=research
      - SEMAPHORE_LIMIT=10
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,component,network"
    labels:
      - "service=graphiti-mcp-server"
      - "component=mcp-server"
      - "network=pa-internal"
      - "mcp-transport=http"
      - "mcp-version=1.0.0"
      - "security.internal-only=true"
      - "security.no-external-access=true"

  # --- RAG MCP Server ---
  rag-mcp-server:
    build:
      context: ./rag-mcp
      dockerfile: Dockerfile
    container_name: rag-mcp-server
    restart: unless-stopped
    networks: [pa-internal]
    volumes:
      - rag-mcp-data:/app/data
    environment:
      # Common MCP variables
      - MCP_SERVER_NAME=rag-tools
      - MCP_SERVER_VERSION=1.0.0
      - MCP_SERVER_DESCRIPTION=RAG tools for retrieval-augmented generation
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8080
      - MCP_SERVER_PATH=/mcp
      - MCP_LOG_LEVEL=INFO
      - MCP_LOG_FORMAT=json
      - MCP_HEALTH_CHECK_PATH=/health
      
      # RAG-specific variables (placeholders for future implementation)
      - VECTOR_DB_URL=http://vector-db:8080
      - DOCUMENT_STORE_URL=http://document-store:8080
      - EMBEDDING_MODEL=text-embedding-ada-002
      - PORT=8080
    ports:
      - "8085:8080"  # Map external 8085 to internal 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,component,network"
    labels:
      - "service=rag-mcp-server"
      - "component=mcp-server"
      - "network=pa-internal"
      - "mcp-transport=http"
      - "mcp-version=1.0.0"
      - "security.internal-only=true"
      - "security.no-external-access=true"

  # --- Drive RAG Service ---
  drive-rag-service:
    build:
      context: ./drive-rag-service
      dockerfile: Dockerfile
    container_name: drive-rag-service
    restart: unless-stopped
    networks: [pa-internal]
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      # Supabase connection
      - SUPABASE_URL=http://supabase-rest:3000
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      # OpenAI for embeddings
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Google OAuth credentials
      - GOOGLE_CREDENTIALS_PATH=/app/credentials
      - GOOGLE_TOKEN_PATH=/app/credentials/drive-docs-token.json
      # Embedding configuration
      - EMBEDDING_MODEL=text-embedding-ada-002
      - EMBEDDING_BATCH_SIZE=100
      - EMBEDDING_DIMENSIONS=1536
      # Chunking configuration
      - MAX_CHUNK_CHARS=6000
      - MIN_CHUNK_CHARS=1200
      # Entity extraction via Graphiti (adds entities to Neo4j knowledge graph)
      - ENABLE_ENTITY_EXTRACTION=false
      - GRAPHITI_BASE_URL=http://graphiti-mcp-server:8000
      # Snapshot storage for document diff/edit tracking
      - SNAPSHOT_BASE_PATH=/data/snapshots
    volumes:
      - ~/.gmail-mcp:/app/credentials
      - /Volumes/main-filestore/ai-PA-data/drive-rag-snapshots:/data/snapshots
    ports:
      - "8095:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "service=drive-rag-service"
      - "component=rag"
      - "network=pa-internal"
      - "security.internal-only=true"

  scheduler-service:
    build:
      context: ./scheduler-service
    container_name: scheduler-service
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      SCHEDULER_DB_URL: ${SCHEDULER_DB_URL:-postgresql+asyncpg://scheduler_service:${SCHEDULER_DB_PASSWORD:-scheduler_secret}@supabase-db:5432/scheduler_service}
      SCHEDULER_DB_PASSWORD: ${SCHEDULER_DB_PASSWORD:-scheduler_secret}
      SCHEDULER_API_KEY: ${SCHEDULER_API_KEY:-}
      LETTA_CALLBACK_URL: ${LETTA_CALLBACK_URL:-http://letta:8283/v1/agents/%agent_id%/messages}
      ALLOWLIST_SCRIPT_DIR: /app/scripts
      LETTA_BASE_URL: http://letta:8283
      SCHEDULER_TIMEZONE: America/New_York
    volumes:
      - ./scheduler-service/scripts:/app/scripts:ro
      - ./deployment/scripts:/workspace/deployment/scripts:ro
      - "/Volumes/main-filestore/ai-PA-backups:/workspace/deployment/backups"
      - ./deployment/logs:/workspace/deployment/logs
      - ./.env:/workspace/.env:ro
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      - ./docs:/workspace/docs:ro
      - ./.git:/workspace/.git:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [pa-internal]
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "service=scheduler-service"
      - "component=scheduler"
      - "network=pa-internal"

  scheduler-mcp:
    build:
      context: ./scheduler-mcp
    container_name: scheduler-mcp
    restart: unless-stopped
    depends_on:
      scheduler-service:
        condition: service_started
    environment:
      SCHEDULER_BASE_URL: ${SCHEDULER_BASE_URL:-http://scheduler-service:8087/v1}
      SCHEDULER_API_KEY: ${SCHEDULER_API_KEY:-}
    networks: [pa-internal]
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "service=scheduler-mcp"
      - "component=mcp-server"
      - "network=pa-internal"
      - "mcp-transport=http"
      - "mcp-version=0.1.0"
      - "security.internal-only=true"

  # --- Granola Meeting Ingest Service ---
  granola-ingest:
    build:
      context: ./granola-ingest
    container_name: granola-ingest
    restart: unless-stopped
    environment:
      LETTA_BASE_URL: http://letta:8283
      GRANOLA_MCP_URL: http://host.docker.internal:8089/mcp
      GRANOLA_AGENT_ID: agent-398b4f6c-6afa-493f-8063-897c6b171a0d
      GRANOLA_STATE_FILE: /data/state/.granola_mcp_import_state.json
      GRANOLA_EXPORT_DIR: /data/exports
    volumes:
      - ./letta:/data/state
      - /Users/dorseyhomeserver/Dropbox/Granola-exports:/data/exports
    networks: [pa-internal]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "service=granola-ingest"
      - "component=ingest"
      - "network=pa-internal"

  # --- Calendly MCP Server ---
  calendly-mcp-server:
    build:
      context: ./calendly-mcp-server
      dockerfile: Dockerfile
    container_name: calendly-mcp-server
    restart: unless-stopped
    networks: [pa-internal]
    environment:
      # Common MCP variables
      - MCP_SERVER_NAME=calendly-tools
      - MCP_SERVER_VERSION=1.0.0
      - MCP_SERVER_DESCRIPTION=Calendly availability checking tools
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8086
      - MCP_SERVER_PATH=/mcp
      - MCP_LOG_LEVEL=INFO
      - MCP_LOG_FORMAT=json
      - MCP_HEALTH_CHECK_PATH=/health
      
      # Calendly-specific variables
      - CALENDLY_DEFAULT_TIMEZONE=America/New_York
      - CALENDLY_REQUEST_TIMEOUT=30
      - PORT=8086
    ports:
      - "8086:8086"  # Expose for Letta Desktop access
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,component,network"
    labels:
      - "service=calendly-mcp-server"
      - "component=mcp-server"
      - "network=pa-internal"
      - "mcp-transport=http"
      - "mcp-version=1.0.0"
      - "security.internal-only=true"
      - "security.no-external-access=true"

  slack-analytics-mcp-server:
    build:
      context: .
      dockerfile: ./slack-analytics-mcp-server/Dockerfile
    container_name: slack-analytics-mcp-server
    restart: unless-stopped
    networks: [pa-internal]
    environment:
      - SLACK_ANALYTICS_SCRIPT_PATH=/app/slack_analytics_with_dates.py
      - SLACK_ANALYTICS_AUTH_FILE=/app/slack_auth_state.json
      - SLACK_ANALYTICS_SCREENSHOT_DIR=/app/slack_analytics_screenshots
      - SLACK_ANALYTICS_TIMEOUT=150
      - SLACK_ANALYTICS_HEADLESS=true
    volumes:
      - ./slack_auth_state.json:/app/slack_auth_state.json
      - ./slack_analytics_screenshots:/app/slack_analytics_screenshots
      - ./scripts/slack_analytics_with_dates.py:/app/slack_analytics_with_dates.py:ro
    ports:
      - "8097:8087"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "service=slack-analytics-mcp-server"
      - "component=mcp-server"
      - "network=pa-internal"
      - "mcp-transport=http"
      - "mcp-version=1.0.0"
      - "security.internal-only=true"

  # --- Health Monitor Service ---
  health-monitor:
    build:
      context: ./health-monitor
      dockerfile: Dockerfile
    container_name: health-monitor
    restart: unless-stopped
    networks: [pa-internal]
    depends_on:
      - graphiti-mcp-server
      - rag-mcp-server
      - calendly-mcp-server
    environment:
      - NODE_ENV=production
      - PORT=8083
      - HEALTH_CHECK_INTERVAL=30
    ports:
      - "8083:8083"  # Expose for external access to dashboard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,component,network"
    labels:
      - "service=health-monitor"
      - "component=monitoring"
      - "network=pa-internal"
      - "external-access=true"
      - "dashboard=true"



# Cloudflare tunnel configuration is below in the cloudflare-tunnel service


  # Letta is an agent building framework with built-in memory/vectordb support.
  # https://docs.letta.com/quickstart/docker
  letta:
    image: letta/letta:0.16.6
    entrypoint: ["/bin/bash", "/app/tools/letta/entrypoint-wrapper.sh"]
    command: ["--host", "0.0.0.0"]
    ports:
      - "8283:8283"  # Letta web interface
    volumes:
      - ./letta/letta_mcp_config.json:/root/.letta/mcp_config.json
      - ./letta:/app/tools/letta  # Mount letta directory for tool execution (different path to avoid conflicts)
      - ./gws-bridge/credentials.json:/root/.gws/credentials.json:ro  # gws CLI credentials (Gmail/Calendar/Drive)
      - ./analytics:/app/tools/analytics  # Mount analytics directory for briefing output
      - ./omnifocus-cli:/app/tools/omnifocus-cli:ro  # OmniFocus CLI source for pip install
      - ./notebooklm-cli:/app/tools/notebooklm-cli:ro  # NotebookLM CLI source for pip install
      - ${NOTEBOOKLM_HOME:-~/.notebooklm}:/notebooklm-auth:ro  # NotebookLM auth cookies
      - ./slack-cli:/app/tools/slack-cli:ro  # Slack CLI source for pip install
      - ~/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro  # SSH key for laptop access via Tailscale
      - ~/.ssh/known_hosts_laptop:/root/.ssh/known_hosts:ro  # Laptop host key
    networks: [pa-internal]
    environment:
      PYTHONPATH: "/app/tools/letta"
      LETTA_DEBUG: "${LETTA_DEBUG:-false}"
      LETTA_PG_URI: "postgresql://letta:letta_dev_password@supabase-db:5432/letta"
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      TOOL_EXEC_DIR: "/app/tools/letta"  # Directory where tools are executed
      TOOL_EXEC_VENV_NAME: "env"  # Virtual environment name (Letta will create it and install requirements.txt)
      # Letta API configuration (for agent-to-agent communication)
      LETTA_API_KEY: "${LETTA_API_KEY:-}"  # Optional: API key for authenticated requests
      LETTA_BASE_URL: "http://localhost:8283"  # Base URL for Letta API (used by tools)
      # Rover LettaBot on laptop (for message_rover_local tool)
      ROVER_LETTABOT_URL: "${ROVER_LETTABOT_URL:-http://100.95.213.46:8080}"
      ROVER_LETTABOT_API_KEY: "${ROVER_LETTABOT_API_KEY:-}"
      NOTEBOOKLM_STORAGE: "/notebooklm-auth/storage_state.json"  # NotebookLM auth path inside container
      NOTEBOOKLM_REMOTE_HOST: "${NOTEBOOKLM_REMOTE_HOST:-cc-tn2wdg94p2}"  # Tailscale host for remote file fetch
      # https://docs.letta.com/guides/server/providers/anthropic
      ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY
      # https://docs.letta.com/guides/server/providers/google
      GEMINI_API_KEY: $GEMINI_API_KEY
      #OLLAMA_BASE_URL: $OLLAMA_BASE_URL
      # Letta authenticates to LiteLLM proxy with master key (not real OpenAI key)
      # Real per-agent keys are in LiteLLM's config, selected by model alias
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}  # All OpenAI calls route through LiteLLM proxy
      OPENAI_API_BASE: http://litellm:4000/v1  # Route all OpenAI model calls via LiteLLM
      # GitHub token for GitHub stars tool
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      # Slack tokens for slack-cli and analytics tools
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_MCP_XOXP_TOKEN: $SLACK_MCP_XOXP_TOKEN
      MY_EMAIL: "${MY_EMAIL:-cdorsey@concord.org}"
      # Atlassian Rovo MCP Server token
      ATLASSIAN_ROVO_TOKEN: "${ATLASSIAN_ROVO_TOKEN:-70121-cecc6a6e-e07f-440f-bcef-0e1b8d0fe274:qe97rgirCzv2J2Zm:aVN_aZh27EoEo4TfjaoTTNs9HEcqQeZp}"
      # Drive RAG service URL for document search tools
      DRIVE_RAG_SERVICE_URL: "http://drive-rag-service:8000"
      # Exa.ai API key for web search tools
      EXA_API_KEY: "${EXA_API_KEY:-}"
      # PostgREST access for analytics snapshot persistence
      SUPABASE_REST_URL: "http://supabase-rest:3000"
      SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_KEY}"
      # Slackbot notify endpoint for agent-initiated DMs
      SLACKBOT_NOTIFY_URL: "http://slackbot:8081/api/notify"
      # gws CLI credentials file path (Google Workspace CLI)
      GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE: "/root/.gws/credentials.json"
      OMNIFOCUS_BRIDGE_URL: "http://host.docker.internal:8889"
      # Redis for Letta background streaming (required by Letta Code CLI)
      LETTA_REDIS_HOST: "redis"
      LETTA_REDIS_PORT: "6379"
      # Do not attempt to use Ollama, LM Studio or OpenRouter chat models with Letta.
      # Letta is *very* picky and will only reliably work with the major cloud providers.
      # Embedding models will work fine, but only uncomment if you know what you're doing.
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8283/v1/health/"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 1s


  # LiteLLM proxy for per-agent cost tracking
  # Routes OpenAI calls through a proxy that logs spend per user/agent to PostgreSQL
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    networks: [pa-internal]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LITELLM_DATABASE_URL: "postgresql://litellm:${LITELLM_DB_PASSWORD:-litellm_secret}@supabase-db:5432/litellm"
      # Per-agent OpenAI API keys
      OPENAI_KEY_MAIN: ${OPENAI_KEY_MAIN}
      OPENAI_KEY_MAIN_SLEEPTIME: ${OPENAI_KEY_MAIN_SLEEPTIME}
      OPENAI_KEY_CALENDAR: ${OPENAI_KEY_CALENDAR}
      OPENAI_KEY_DOCS_TRANSCRIPTS: ${OPENAI_KEY_DOCS_TRANSCRIPTS}
      OPENAI_KEY_EMAIL: ${OPENAI_KEY_EMAIL}
      OPENAI_KEY_PULSE: ${OPENAI_KEY_PULSE}
      OPENAI_KEY_PULSE_SLEEPTIME: ${OPENAI_KEY_PULSE_SLEEPTIME}
      OPENAI_KEY_TASKS: ${OPENAI_KEY_TASKS}
      OPENAI_KEY_TASKS_SLEEPTIME: ${OPENAI_KEY_TASKS_SLEEPTIME}
      OPENAI_KEY_MEDIA: ${OPENAI_KEY_MEDIA}
      OPENAI_KEY_MEDIA_SLEEPTIME: ${OPENAI_KEY_MEDIA_SLEEPTIME}
      OPENAI_KEY_OLD_AGENTS: ${OPENAI_KEY_OLD_AGENTS}
      OPENAI_KEY_FALLBACK: ${OPENAI_KEY_FALLBACK}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/health/liveliness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # CLIProxyAPI — exposes Claude Max / ChatGPT Plus subscriptions as OpenAI-compatible API
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    container_name: cli-proxy-api
    restart: unless-stopped
    ports:
      - "8317:8317"     # Main API
      - "54545:54545"   # Claude OAuth callback
      - "1455:1455"     # Codex OAuth callback
    volumes:
      - ./cli-proxy-api/config.yaml:/CLIProxyAPI/config.yaml
      - ./cli-proxy-api/auths:/CLIProxyAPI/auths
      - ./cli-proxy-api/logs:/CLIProxyAPI/logs
    networks: [pa-internal]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.ai-pa.service=cli-proxy-api"
      - "com.ai-pa.component=llm-proxy"
      - "com.ai-pa.network=internal"

