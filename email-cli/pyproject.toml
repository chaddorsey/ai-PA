[tool.poetry]
name = "email-cli"
version = "0.1.0"
description = "Agent-first CLI for email-agent ops: Gmail-thread watch lifecycle + TaskQueue label processing. Wraps the bespoke Python tools from letta/email-tools/."
authors = ["ai-PA"]
packages = [{include = "email_cli", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1"

[tool.poetry.scripts]
email-agent = "email_cli.cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
