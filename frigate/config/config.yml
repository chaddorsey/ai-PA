# Frigate config — fox-den camera
# Reference: https://docs.frigate.video/configuration/

mqtt:
  enabled: false  # Wire up later when highlight-curator is added (Phase 9)

# Frigate's internal go2rtc — needed for the UI's live preview (WebRTC
# + MSE). Without streams here, the UI shows "No frames have been
# received" because there's nothing for jsmpeg/WebRTC to subscribe to.
# Each entry is a passthrough from the host go2rtc relay where the
# actual camera RTSP termination happens.
go2rtc:
  streams:
    fox_den_1:
      - rtsp://host.docker.internal:8555/fox_den_1
    fox_den_1_sub:
      - rtsp://host.docker.internal:8555/fox_den_1_sub
    fox_den_2:
      - rtsp://host.docker.internal:8555/fox_den_2
    fox_den_2_sub:
      - rtsp://host.docker.internal:8555/fox_den_2_sub
    fox_den_3:
      - rtsp://host.docker.internal:8555/fox_den_3
    fox_den_3_sub:
      - rtsp://host.docker.internal:8555/fox_den_3_sub
    fox_den_4:
      - rtsp://host.docker.internal:8555/fox_den_4
    fox_den_4_sub:
      - rtsp://host.docker.internal:8555/fox_den_4_sub

detectors:
  # Apple Silicon detector running on the macOS host (FrigateDetector.app).
  # Started by launchd: com.ai-pa.frigate-detector
  apple-silicon:
    type: zmq
    endpoint: tcp://host.docker.internal:5555

model:
  # YOLO11-S exported via ultralytics @ 640x640.
  #
  # MegaDetector v5a was attempted (see frigate/tools/patch_megadetector_to_yolov8.py)
  # but the YOLOv5→YOLOv8 output graph patch caused CoreML to hang on
  # inference (model loaded but inference_speed = 1.4e11ms, every frame
  # skipped). The patched Split/Mul/Concat/Transpose at the output
  # apparently breaks CoreML's graph optimization in a way that makes
  # ANE inference effectively infinite. Revisit with a different patch
  # approach (e.g., bake the YOLOv5→v8 conversion into a separate
  # post-processing ONNX, or write a custom Frigate detector plugin
  # that handles YOLOv5 output natively).
  # 2026-05-04 RETRY: pointing at megadetector_yolov8.onnx. YOLO11+COCO
  # confirmed unable to detect foxes on cluttered IR scenes (debug
  # overlay showed motion + region crops without any object detections
  # firing). MegaDetector v5a is wildlife-trained on camera-trap data.
  # If CoreML still hangs on this model file, fall back to yolo.onnx
  # by reverting this block.
  model_type: yolo-generic
  width: 640
  height: 640
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/megadetector_yolov8.onnx
  labelmap_path: /config/megadetector_labels.txt

# ----------------------------------------------------------------------
# Role split:
#   Synology Surveillance Station = primary 24/7 recorder + UI/timeline
#   Frigate (this)                = detection only + alert/event clips
#
# Frigate does NOT do continuous recording (SS owns that). It consumes
# the RTSP substream for detection and only writes short clips when an
# object event fires. This keeps disk usage low and doesn't compete
# with SS for the cameras' RTSP client slots — Dahuas allow 4-ish.
#
# Credentials live in /Volumes/main-drive/ai-PA/.env as FOX_CAM_USER /
# FOX_CAM_PASS. Frigate substitutes ${VAR} at startup.
# ----------------------------------------------------------------------
cameras:
  fox_den_1:
    enabled: true  # Flip to true once .env credentials are in place
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8555/fox_den_1_sub
          roles:
            - detect
        - path: rtsp://host.docker.internal:8555/fox_den_1
          roles:
            - record
    detect:
      enabled: true
      width: 704   # Dahua substream default
      height: 480
      fps: 3
    objects:
      track:
        - animal
        - person
      filters:
        animal:
          min_score: 0.05
          threshold: 0.15
        person:
          min_score: 0.10
          threshold: 0.20

    motion:
      threshold: 17
      contour_area: 8
      improve_contrast: true
      mask:
        - 0.853,0.078,0.972,0.078,0.969,0.036,0.857,0.042
        - 0.004,0.212,0.154,0.156,0.154,0,0,0.003
        - 0.416,0.106,0.99,0.039,0.994,0.003,0.407,0.003
    zones:
      den_exit_2:
        coordinates: 0.996,0.089,0.418,0.123,0.5,0.989,0.992,0.983
        loitering_time: 0
        objects:
          - animal
        friendly_name: Den Exit 2
        inertia: 3
      den_exit_2_-_side:
        coordinates: 0.152,0.173,0.007,0.229,0.009,0.994,0.171,0.989
        loitering_time: 0
        objects:
          - animal
        friendly_name: Den Exit 2 - Side
    review:
      alerts:
        required_zones: den_exit_2
  fox_den_2:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8555/fox_den_2_sub
          roles:
            - detect
        - path: rtsp://host.docker.internal:8555/fox_den_2
          roles:
            - record
    detect:
      enabled: true
      width: 704
      height: 480
      fps: 3
    objects:
      track:
        - animal
        - person
      filters:
        animal:
          min_score: 0.05
          threshold: 0.15
        person:
          min_score: 0.10
          threshold: 0.20

    motion:
      threshold: 17
      contour_area: 8
      improve_contrast: true
    zones: {}
  fox_den_3:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8555/fox_den_3_sub
          roles:
            - detect
        - path: rtsp://host.docker.internal:8555/fox_den_3
          roles:
            - record
    detect:
      enabled: true
      width: 704
      height: 480
      fps: 3
    objects:
      track:
        - animal
        - person
      filters:
        animal:
          min_score: 0.05
          threshold: 0.15
        person:
          min_score: 0.10
          threshold: 0.20

# ----------------------------------------------------------------------
# Recording policy: SHORT alert clips only (SS handles bulk recording).
# ----------------------------------------------------------------------
    # Motion mask + zones stripped 2026-05-11 after fox_den_3 was
    # physically relocated. The previous polygons were anchored to
    # pixel coordinates from the old camera position and no longer
    # corresponded to anything meaningful in the new scene.
    # Defaults (no mask, no zone gating) until/unless we redraw via
    # the Frigate UI for the new view.
    motion:
      threshold: 17
      contour_area: 8
      improve_contrast: true
    zones: {}

  # Amcrest 4K at 192.168.7.21 — added 2026-05-03. Zones/masks left
  # unset; draw them in the Frigate UI once the camera is positioned.
  fox_den_4:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://host.docker.internal:8555/fox_den_4_sub
          roles:
            - detect
        - path: rtsp://host.docker.internal:8555/fox_den_4
          roles:
            - record
    detect:
      enabled: true
      width: 704
      height: 480
      fps: 3
    objects:
      track:
        - animal
        - person
      filters:
        animal:
          min_score: 0.05
          threshold: 0.15
        person:
          min_score: 0.10
          threshold: 0.20
    motion:
      threshold: 17
      contour_area: 8
      improve_contrast: true

record:
  enabled: true
  alerts:
    # Generous pre/post — clips draw from the rolling record buffer so
    # this costs disk only, not CPU. 30+20 ensures we usually capture
    # the subject *entering* the frame (Frigate's object detector
    # takes ~5-10s to lock onto a moving subject; 30s pre gives a
    # comfortable margin even when the fox arrived slowly).
    pre_capture: 30
    post_capture: 20
    retain:
      days: 30
  detections:
    pre_capture: 20
    post_capture: 15
    retain:
      days: 14

snapshots:
  enabled: true
  retain:
    default: 30

# ----------------------------------------------------------------------
# Storage paths inside the container — mapped to the NAS at /Volumes/fox-cam
# ----------------------------------------------------------------------
# No global ffmpeg block — Apple Silicon has no Linux-compatible GPU
# passthrough, so we let ffmpeg fall back to software decoding of the
# 704×480 substreams at 5fps (trivial CPU load).

version: 0.17-0
semantic_search:
  enabled: false
  model_size: small
face_recognition:
  enabled: false
  model_size: small
lpr:
  enabled: false
classification:
  bird:
    enabled: true
