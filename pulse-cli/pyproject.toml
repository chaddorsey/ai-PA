[tool.poetry]
name = "pulse-cli"
version = "0.1.0"
description = "Agent-first CLI for pulse-monitor analytics ops. Wraps the bespoke Python tools so the local-mode pulse agent can drive briefing composition and analytics collection from Bash."
authors = ["ai-PA"]
packages = [{include = "pulse_cli", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1"
requests = "^2.31"

[tool.poetry.scripts]
pulse = "pulse_cli.cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
