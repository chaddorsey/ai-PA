# National/regional historical backbone for the narration's TEMPORAL axis.
# The narrator places a place's local dates against these — for contemporaneity
# ("the year barbed wire was patented…") and succession (cause→effect over time).
# Each entry: `year` (int) OR `span: [start, end]`; `event`; `themes` (free tags);
# `regions` (state codes / broad areas / "national" — for relevance weighting).
# Curated, accurate, deliberately compact — the deep backbone, not every fact.

# ── Expansion & exploration ──────────────────────────────────────────────
- {year: 1803, event: "Louisiana Purchase doubles the United States", themes: [expansion, federal], regions: [national]}
- {span: [1804, 1806], event: "Lewis & Clark Expedition maps the Missouri & Columbia", themes: [exploration, rivers], regions: [Great Plains, Pacific NW]}
- {span: [1821, 1880], event: "Santa Fe Trail trade era (Missouri↔Santa Fe)", themes: [trail, trade, frontier], regions: [MO, KS, CO, NM]}
- {span: [1846, 1848], event: "Mexican–American War", themes: [war, expansion], regions: [Southwest, TX, NM, CA]}
- {year: 1848, event: "Treaty of Guadalupe Hidalgo cedes the Southwest to the U.S.", themes: [war, expansion, displacement], regions: [Southwest, TX, NM, AZ, CA]}
- {span: [1848, 1855], event: "California Gold Rush", themes: [gold, boom, migration], regions: [CA]}
- {year: 1859, event: "Pike's Peak Gold Rush draws thousands to Colorado", themes: [gold, boom, mining], regions: [CO]}

