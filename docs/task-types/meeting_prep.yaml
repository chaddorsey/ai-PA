# Meeting Prep Task Type v2
# Calendar-first resolution, then parallel gather, main agent evaluation, optional refinement
#
# Phase flow: Resolve (calendar) -> Gather (parallel) -> Evaluate (main agent) -> Refine -> Synthesize

name: meeting_prep
version: 2.0.0
lifecycle_stage: active
created: 2026-01-29
updated: 2026-02-27

goal: "Gather relevant context before meetings using calendar-first resolution and iterative refinement"

trigger: "User asks to prep for a specific meeting"

# Calendar agent runs first (Phase 0) to resolve meeting details before other agents search
resolve_agent: calendar

success_criteria:
  - "Meeting identified with correct participants and time"
  - "Relevant documents and transcripts surfaced"
  - "Recent communications provide useful context"
  - "Search strategies are reported for evaluation"

agents:
  calendar:
    prompt_template: |
      RESOLVE MEETING: Find the UPCOMING meeting matching '{meeting_identifier}'.

      Focus on meetings happening TODAY or in the near future, not past events.
      If multiple meetings match, choose the soonest upcoming one.

      Look up and include:
      - Meeting title (exact as it appears on calendar)
      - Date and time (formatted like "2:00 PM Feb 27")
      - All participants: full names AND email addresses
      - Video conference link if present
      - Location or room
      - Any attachments or URLs in the event description

      IMPORTANT: Write your findings using the memory tool. Format your output as structured data
      so the orchestrator can parse it.

      Use: memory("insert", "coordination_gathered_{identity_id}_calendar", insert_text="[Calendar HH:MM] TITLE: <exact title> | TIME: <date and time> | PARTICIPANTS: <Name1 (email1), Name2 (email2), ...> | LINK: <video url or none> | LOCATION: <location or none>", insert_line=0)

      If NO matching meeting is found, still write:
      memory("insert", "coordination_gathered_{identity_id}_calendar", insert_text="[Calendar HH:MM] NO_MATCH: No upcoming meeting found matching '{meeting_identifier}'", insert_line=0)
    timeout_seconds: 60
    expected_contribution: "Structured meeting details: title, time, participants with emails, links"

  document:
    enabled: true
    prompt_template: |
      GATHER DOCUMENTS for meeting: '{resolved_title}'
      Participants: {resolved_participants}
      Meeting time: {resolved_time}

      Search for documents and transcripts that could help prepare for this meeting.
      Think broadly about what might be relevant:

      1. Search by participant names — documents authored by or shared with attendees
      2. Search by meeting topic keywords from the title
      3. Search for "Briefing" documents mentioning any participant's first name
      4. Search for past meeting transcripts with these participants
      5. Search for recently edited documents (last 7 days) related to the topic

      Use search_documents and query_granola_meetings with multiple different queries.

      REPORT YOUR STRATEGY: Before writing findings, note what search terms you used
      and how many results each returned. This helps evaluate search quality.

      Write findings using memory tool:
      memory("insert", "coordination_gathered_{identity_id}_document", insert_text="[Document HH:MM] STRATEGY: <what you searched for and result counts> | FINDINGS: <document titles with brief relevance notes, action items from transcripts>", insert_line=0)

      If nothing found:
      memory("insert", "coordination_gathered_{identity_id}_document", insert_text="[Document HH:MM] STRATEGY: <searches attempted> | FINDINGS: No relevant documents found", insert_line=0)
    timeout_seconds: 90
    expected_contribution: "Relevant docs, transcripts, agendas, action items, with search strategy report"

  email:
    prompt_template: |
      GATHER EMAIL CONTEXT for meeting: '{resolved_title}'
      Participants: {resolved_participants}
      Participant emails: {resolved_emails}
      Meeting time: {resolved_time}

      Search for recent email threads that provide context for this meeting.
      Try multiple search strategies:

      1. Search by participant email addresses (most reliable)
      2. Search by meeting title or topic keywords
      3. Search by participant first names + topic keywords
      4. Look back 7-14 days for threads with these participants

      REPORT YOUR STRATEGY: Note what search terms you used and result counts.

      Write findings using memory tool. Use memory_insert if available, otherwise use:
      memory_insert("coordination_gathered_{identity_id}_email", "[Email HH:MM] STRATEGY: <searches and counts> | FINDINGS: <thread subjects, key points, action items, concerns raised>")

      If nothing found:
      memory_insert("coordination_gathered_{identity_id}_email", "[Email HH:MM] STRATEGY: <searches attempted> | FINDINGS: No recent email threads found")
    timeout_seconds: 120
    expected_contribution: "Recent email threads with participants, concerns, action items, with search strategy"

  pulse:
    enabled: true
    prompt_template: |
      GATHER SLACK CONTEXT for meeting: '{resolved_title}'
      Participants: {resolved_participants}
      Meeting time: {resolved_time}

      Search Slack for messages that provide context for this meeting.
      Try multiple search strategies:

      1. Search for participant names in recent messages
      2. Search for meeting topic keywords
      3. Search for prep-related language ("need to prepare", "before the meeting", "agenda")
      4. Look for shared URLs or documents related to the topic

      REPORT YOUR STRATEGY: Note what search terms you used and result counts.

      Write findings using memory tool:
      memory("insert", "coordination_gathered_{identity_id}_pulse", insert_text="[Pulse HH:MM] STRATEGY: <searches and counts> | FINDINGS: <prep tasks, shared links, availability notes, key discussion points>", insert_line=0)

      If nothing found:
      memory("insert", "coordination_gathered_{identity_id}_pulse", insert_text="[Pulse HH:MM] STRATEGY: <searches attempted> | FINDINGS: No relevant Slack messages found", insert_line=0)
    timeout_seconds: 60
    expected_contribution: "Slack context, prep tasks, shared URLs, availability, with search strategy"

synthesis:
  mode: main_agent_evaluation
  evaluation_prompt: |
    You are evaluating the results of a meeting prep search for '{resolved_title}'.
    Meeting time: {resolved_time}
    Participants: {resolved_participants}

    Here are the findings from each specialist agent, including the search strategies they used:

    **Calendar:** {calendar_findings}
    **Documents:** {document_findings}
    **Email:** {email_findings}
    **Slack:** {pulse_findings}

    Evaluate the quality of these findings:
    1. Did each agent search effectively? Were good search terms used?
    2. Are there obvious gaps — participants not searched for, topics not explored?
    3. Based on what was found, are there follow-up searches that would be valuable?

    For any agent that should refine its search, call request_agent_followup with
    the agent name and a specific prompt describing what to search for differently.

    For example, if the document agent only searched by meeting title but a participant
    name might yield briefing docs, call:
    request_agent_followup("document", "Search for documents with 'Briefing' in the title mentioning <name>. Also search for docs recently shared by <email>.")

    If the findings look sufficient, do not call request_agent_followup — just respond
    with your assessment that the search was adequate.

  synthesis_prompt: |
    Compile a concise meeting prep brief for '{resolved_title}'.
    Meeting time: {resolved_time}
    Participants: {resolved_participants}

    Findings:
    {all_findings}

    Create a brief that includes:
    - Meeting details (time, participants, link)
    - Key documents and their relevance
    - Recent context from email and Slack
    - Action items or open questions from prior interactions
    - Suggested preparation priorities

    Be concise and actionable. Focus on what the user needs to know before walking into this meeting.

  template: |
    **{resolved_title}** — {resolved_time}

    **Participants:** {resolved_participants}

    **Calendar:** {calendar_findings}

    **Documents & Transcripts:** {document_findings}

    **Recent Email Context:** {email_findings}

    **Slack Context:** {pulse_findings}

metrics:
  - agent_contribution_rate
  - follow_up_questions_needed
  - time_to_completion
  - synthesis_length
  - refinement_round_count

