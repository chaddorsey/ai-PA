    - fourth down decisions
    - game script
    - ball control
    - tempo
    - personnel groupings

# ============================================================================
# BREAK/STOPPAGE TEMPLATES
# Used during TV timeouts, team timeouts, halftime, and other stoppages
# These are opportunities for deeper analysis while the viewer has downtime
# ============================================================================

break_templates:
  halftime:
    priority: 10
    timing: stoppage
    ttl: 600
    headlines:
      - "⏸️ Halftime Report"
      - "📊 First Half Wrap-Up"
      - "🏈 Halftime Analysis"
    bodies:
      - "Time to break down everything we've seen in the first 30 minutes."
      - "Let's review the key storylines from the first half."
      - "A chance to analyze the game script heading into the second half."
  
  tv_timeout:
    priority: 7
    timing: stoppage
    ttl: 120
    headlines:
      - "📺 Commercial Break"
      - "🎬 Quick Break Analysis"
      - "⏱️ TV Timeout"
    bodies:
      - "A good moment to check the key stats and momentum so far."
      - "While the networks take a break, let's catch up on the game story."
      - "Quick timeout—here's where things stand."
  
  team_timeout:
    priority: 6
    timing: stoppage
    ttl: 60
    headlines:
      - "⏱️ {team} Takes a Timeout"
      - "🤔 Strategic Pause"
      - "⏸️ Timeout Called"
    bodies:
      - "The coach wants to talk to the players—likely adjusting the play call."
      - "A moment to regroup. Watch what personnel they bring out next."
      - "Sometimes you need to stop the clock and reset."
  
  two_minute_warning:
    priority: 9
    timing: stoppage
    ttl: 120
    headlines:
      - "⚠️ Two-Minute Warning"
      - "🚨 Inside Two Minutes"
      - "⏰ Crunch Time"
    bodies:
      - "The automatic timeout. Everything gets more intense from here."
      - "Two minutes left—clock management becomes critical."
      - "The final stretch. Every decision matters now."
  
  quarter_break:
    priority: 7
    timing: stoppage
    ttl: 180
    headlines:
      - "📋 End of Quarter {quarter}"
      - "🔄 Switching Sides"
      - "Quarter {quarter} Complete"
    bodies:
      - "Teams switch ends. A brief pause to reset."
      - "One quarter down, quick summary before we continue."
      - "Time to adjust strategies heading into the next period."
  
  challenge:
    priority: 8
    timing: stoppage
    ttl: 180
    headlines:
      - "🔍 Under Review"
      - "📹 Challenge Flag"
      - "⚖️ Official Review"
    bodies:
      - "The officials are taking a closer look. This could change things."
      - "A pivotal call is being reviewed. The next few moments could shift momentum."
      - "Close call on the field—let's see what the replay shows."

# Analysis patterns for different break scenarios
break_analysis_prompts:
  close_game:
    headline: "Tight Contest"
    body: "Just {diff} points separate these teams. Every possession is critical."
  
  blowout:
    headline: "One-Sided Affair"  
    body: "{leader} has built a commanding {diff}-point lead. {trailer} needs a spark."
  
  comeback_brewing:
    headline: "Momentum Shifting?"
    body: "{trailing_team} has scored {recent_points} unanswered. The deficit is shrinking."
  
  defensive_battle:
    headline: "Defense Rules"
    body: "Low-scoring affair so far. Both defenses are playing tough."
  
  shootout:
    headline: "Offensive Showcase"
    body: "Points are flying! Combined {total_points} points already."

