# Auto-Madden Insight Templates
# 
# Templates for generating quick insights based on game situations.
# Variables are substituted using {variable_name} syntax.
#
# Each template has:
#   - priority: 1-10, higher = more important/urgent
#   - timing: immediate, pre_snap, post_play, stoppage
#   - ttl: seconds before insight becomes stale
#   - headline: brief summary (5-10 words)
#   - body: explanation (2-3 sentences max)

situation_templates:
  third_down:
    short:
      priority: 7
      timing: pre_snap
      ttl: 15
      headline: "3rd and {distance}—short yardage"
      body: |
        Only need {distance} yards for a first down.
        Run is likely here, but watch for play-action—
        the defense will crowd the line expecting run.
    
    medium:
      priority: 6
      timing: pre_snap
      ttl: 15
      headline: "3rd and {distance}—manageable"
      body: |
        Need {distance} yards. This is typically a passing down.
        Watch for a quick route designed to hit right at the marker.
    
    long:
      priority: 6
      timing: pre_snap
      ttl: 15
      headline: "3rd and {distance}—tough conversion"
      body: |
        {distance} yards is a lot to ask. Teams convert only about
        25% of these. Watch for a defensive blitz—they smell a punt.

  fourth_down:
    go_for_it:
      priority: 8
      timing: pre_snap
      ttl: 20
      headline: "Going for it on 4th!"
      body: |
        Bold call. Analytics says the expected points from trying
        exceed punting here. Watch for their best short-yardage play.
    
    punt:
      priority: 5
      timing: pre_snap
      ttl: 15
      headline: "Punt coming"
      body: |
        Field position game. They'll try to pin the opponent deep.

  red_zone:
    entry:
      priority: 7
      timing: post_play
      ttl: 30
      headline: "Red zone—scoring territory"
      body: |
        Inside the 20. Teams score touchdowns about 60% of the time
        they reach the red zone. The compressed field helps the defense.

  two_minute_warning:
    first_half:
      priority: 6
      timing: stoppage
      ttl: 60
      headline: "Two-minute warning"
      body: |
        Automatic timeout at 2:00. The offense has a chance to score
        before halftime. Watch for tempo changes.
    
    second_half:
      priority: 8
      timing: stoppage
      ttl: 60
      headline: "Two-minute warning—crunch time"
      body: |
        This is where games are won and lost. Every play matters now.
        Watch for clock management and timeout strategy.

play_templates:
  big_play:
    priority: 8
    timing: post_play
    ttl: 20
    headline: "Big gain: {yards} yards!"
    body: "{description}"

  turnover:
    interception:
      priority: 9
      timing: immediate
      ttl: 30
      headline: "INTERCEPTION!"
      body: |
        The defense picks it off! That's a huge momentum swing.
        The offense just gave away possession.
    
    fumble:
      priority: 9
      timing: immediate
      ttl: 30
      headline: "FUMBLE!"
      body: |
        The ball is loose! Turnovers are often the difference
        between winning and losing.

  touchdown:
    priority: 9
    timing: immediate
    ttl: 45
    headline: "TOUCHDOWN!"
    body: "{description}"

  field_goal:
    priority: 6
    timing: immediate
    ttl: 30
    headline: "Field goal attempt"
    body: |
      Settling for 3 points. The kicker lines up for a {distance} yarder.

  penalty:
    common:
      priority: 5
      timing: post_play
      ttl: 25
      headline: "Flag: {penalty_name}"
      body: "{penalty_description}"
    
    explanations:
      false_start: "Offensive lineman moved before the snap. Free 5 yards for the defense."
      holding: "Lineman grabbed a defender illegally. Often called on big gains—erases the play."
      pass_interference: "Defender interfered with receiver's ability to catch. Spot foul in NFL."
      offsides: "Defender crossed the line before snap. Free 5 yards, possibly a free play."
      roughing_passer: "Hit the quarterback illegally. Automatic first down."

game_state_templates:
  momentum_shift:
    priority: 7
    timing: post_play
    ttl: 45
    headline: "Momentum swinging"
    body: |
      Win probability shifted significantly. Watch how the team
      responds to this swing in momentum.

  close_game:
    priority: 6
    timing: stoppage
    ttl: 120
    headline: "Game coming down to the wire"
    body: |
      Close game with time running out. Every possession is critical.
      Watch for aggressive play-calling.

  blowout:
    priority: 4
    timing: stoppage
    ttl: 120
    headline: "Game getting away"
    body: |
      Large lead developing. The trailing team needs to score quickly
      to have any chance.

# Pre-play templates (shown before the snap)
pre_play_templates:
  1st_down:
    headlines:
      - "Fresh set of downs"
      - "1st & 10—new opportunity"
      - "Reset: 1st down"
    bodies:
      - "Four plays to move the chains. Watch for an early play-action attempt to catch the defense off guard."
      - "The offense has options here. Running to establish tempo is common on first down."
      - "First down gives the offense flexibility. They can be aggressive without worrying about the sticks."
  
  2nd_short:
    headlines:
      - "2nd and short—manageable"
      - "Just {distance} yards to go"
    bodies:
      - "Good position after the first down play. A run up the middle could easily convert."
      - "Short yardage—the offense is in a good spot. Likely a run or quick pass."
  
  2nd_long:
    headlines:
      - "2nd and {distance}—work to do"
      - "Long way to go on 2nd"
    bodies:
      - "Didn't get much on first down. They need chunk yardage to avoid a tough third down."
      - "Second and long is a passing down. The defense knows it—watch for pressure."
  
  4th_down:
    headlines:
      - "4th down decision time"
      - "Punt or go for it?"
    bodies:
      - "Coach has to make a choice. Field position vs. keeping the drive alive."
      - "Analytics increasingly favor going for it, but most coaches play it safe."

# Post-play templates (shown after each play)
post_play_templates:
  pass_complete:
    headlines:
      - "Pass complete for {yards}"
      - "Reception: {yards} yards"
      - "Good catch for {yards}"
    bodies:
      - "Nice throw and catch. Moving the chains."
      - "Solid completion. The offense keeps things rolling."
      - "Finding the open man. Good execution."
  
  run_gain:
    headlines:
      - "Run for {yards} yards"
      - "Ground game: {yards}"
      - "Rushing gain of {yards}"
    bodies:
      - "The run game is working. Keeps the defense honest."
      - "Good push by the offensive line."
      - "Positive yardage on the ground."
  
  incomplete:
    headlines:
      - "Pass incomplete"
      - "Throw falls incomplete"
      - "No connection"
    bodies:
      - "Clock stops. The defense held up in coverage."
      - "Couldn't connect. At least the clock stopped."
      - "Good coverage by the defense."
  
  sack:
    headlines:
      - "SACK! Loss of {yards}"
      - "Quarterback taken down!"
      - "Sack for a {yards} yard loss"
    bodies:
      - "The rush got home! That hurts—loss of yards and a second off the clock."
      - "Protection broke down. The quarterback had nowhere to go."
      - "Big play by the defense. Putting the offense behind the chains."
  
  penalty:
    headlines:
      - "Flag on the play"
      - "Penalty called"
    bodies:
      - "The officials saw something. Penalty will be assessed."
      - "Undisciplined play. Free yards for the other team."

