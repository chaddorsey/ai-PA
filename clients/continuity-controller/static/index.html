<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kinara">
<title>Kinara</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23e8a33d'/%3E%3C/svg%3E">
<style>
  /* The terminal transcript, translated to a phone: calm dark blue-gray surfaces, a
     monospace transcript, one lamp-glow amber accent. Self-contained by design — the
     page is served tailnet-only and loads nothing from anywhere. */
  :root {
    --bg: #14181f;
    --surface: #1b212b;
    --surface-raised: #232b38;
    --ink: #dde4ee;
    --ink-dim: #94a3b3;
    --accent: #e8a33d;
    --accent-ink: #1a1200;
    --peer: #7fa8d9;
    --err: #e06c5f;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: -apple-system, system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.45;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: calc(env(safe-area-inset-top, 0px) + 0.65rem) 1rem 0.65rem;
    background: var(--surface);
    border-bottom: 1px solid #0d1015;
  }
  #state-dot {
    width: 0.62rem; height: 0.62rem; border-radius: 50%;
    background: var(--ink-dim); flex: none;
  }
  #state-dot.connecting { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  #state-dot.live { background: var(--accent); animation: none; }
  #state-dot.down { background: var(--err); animation: none; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  #runtime-label {
    font-family: var(--mono);
    font-size: 0.88rem;
    color: var(--ink-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1;
  }
  #settings-btn {
    background: none; border: none; color: var(--ink-dim);
    font-size: 1.15rem; cursor: pointer; padding: 0.2rem 0.4rem;
  }
  #settings-btn:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1rem 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    overscroll-behavior: contain;
  }
  .msg {
    max-width: 92%;
    padding: 0.55rem 0.8rem;
    border-radius: 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.you {
    align-self: flex-end;
    background: var(--accent);
    color: var(--accent-ink);
    border-bottom-right-radius: 3px;
  }
  .msg.you.pending { opacity: 0.55; }
  .msg.you.failed { background: var(--err); color: #fff; }
  .msg.agent {
    align-self: flex-start;
    background: var(--surface-raised);
    border-bottom-left-radius: 3px;
  }
  .msg.peer {
    align-self: flex-end;
    background: var(--surface-raised);
    color: var(--peer);
    border-bottom-right-radius: 3px;
  }
  .msg.peer::before { content: "peer · "; font-size: 0.75rem; opacity: 0.8; }
  .msg a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
    word-break: break-all;
  }
  .line {
    align-self: center;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--ink-dim);
    padding: 0.1rem 0;
  }
  .line.error { color: var(--err); }
  .line.unseen { color: var(--accent); }
  #working {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--ink-dim);
    padding: 0.2rem 0.3rem;
    display: none;
  }
  #working.on { display: block; animation: pulse 1.4s ease-in-out infinite; }

  form#composer {
    display: flex;
    gap: 0.55rem;
    padding: 0.6rem 0.85rem 0.45rem;
    background: var(--surface);
    border-top: 1px solid #0d1015;
  }
  footer#model-footer {
    text-align: center;
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--ink-dim);
    background: var(--surface);
    padding: 0 0.85rem calc(env(safe-area-inset-bottom, 0px) + 0.35rem);
    min-height: 1em;
  }
  #input {
    flex: 1;
    background: var(--bg);
    border: 1px solid #313c4d;
    border-radius: 10px;
    color: var(--ink);
    font: inherit;
    padding: 0.55rem 0.8rem;
    resize: none;
    max-height: 7.5rem;
  }
  #input:focus-visible { outline: 2px solid var(--accent); border-color: transparent; }
  #send-btn {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 10px;
    font: inherit;
    font-weight: 600;
    padding: 0 1.05rem;
    cursor: pointer;
    flex: none;
  }
  #send-btn:disabled { opacity: 0.4; }
  #send-btn:focus-visible { outline: 2px solid var(--ink); }

  dialog#settings {
    background: var(--surface-raised);
    color: var(--ink);
    border: 1px solid #313c4d;
    border-radius: 14px;
    padding: 1.2rem;
    width: min(92vw, 24rem);
    margin: auto;
  }
  dialog#settings::backdrop { background: rgba(0,0,0,0.6); }
  dialog#settings h2 { font-size: 1rem; margin-bottom: 0.9rem; }
  dialog#settings label {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-dim);
    margin: 0.7rem 0 0.25rem;
  }
  dialog#settings input {
    width: 100%;
    background: var(--bg);
    border: 1px solid #313c4d;
    border-radius: 8px;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 0.85rem;
    padding: 0.5rem 0.6rem;
  }
  dialog#settings input:focus-visible { outline: 2px solid var(--accent); border-color: transparent; }
  dialog#settings menu {
    display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.1rem; list-style: none;
  }
  dialog#settings button {
    font: inherit; border-radius: 8px; padding: 0.45rem 0.95rem; cursor: pointer; border: none;
  }
  #settings-save { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  #settings-cancel { background: none; color: var(--ink-dim); }
</style>
</head>
<body>

<header>
  <span id="state-dot" aria-hidden="true"></span>
  <span id="runtime-label">kinara</span>
  <button id="settings-btn" aria-label="Settings">⚙</button>
</header>

<main id="transcript" aria-live="polite"></main>
<div id="working">agent is working…</div>

<form id="composer">
  <textarea id="input" rows="1" placeholder="Message" autocomplete="off"></textarea>
  <button id="send-btn" type="submit" disabled>Send</button>
</form>
<footer id="model-footer"></footer>

<dialog id="settings">
  <h2>Surface settings</h2>
  <form method="dialog">
    <label for="set-token">Surface token</label>
    <input id="set-token" type="password" autocomplete="off">
    <label for="set-agent">Agent id</label>
    <input id="set-agent" autocomplete="off">
    <label for="set-conv">Conversation id</label>
    <input id="set-conv" autocomplete="off">
    <menu>
      <li><button id="settings-cancel" value="cancel">Cancel</button></li>
      <li><button id="settings-save" value="save">Save & connect</button></li>
    </menu>
  </form>
</dialog>

<script>
"use strict";
/* Surface protocol v1 client (core + notify), minimal web slice. The event-interpretation
   recipe mirrors letta-terminal/src/controller-core.ts — that file is the reference. */

const DEFAULTS = {
  agent_id: "agent-local-8474bbbd-95fc-42f7-b586-eb0cf94a5a5d",
  conversation_id: "local-conv-2181",
};
const LS = { token: "cc.token", agent: "cc.agent", conv: "cc.conv" };

const el = (id) => document.getElementById(id);
const transcript = el("transcript");
const input = el("input");
const sendBtn = el("send-btn");
const stateDot = el("state-dot");
const runtimeLabel = el("runtime-label");
const working = el("working");
const settings = el("settings");

/* iOS home-screen icons run in their own storage container, and that storage is not
   reliably persistent — so a saved bookmark may arrive with empty localStorage. The
   TEMPORARY workaround (until C9's ticket design): the bookmark itself can carry
   `#token=…` (+ optional agent/conv). A fragment is never sent in the HTTP request, so
   it cannot appear in any proxy or serve log; it lives only in the operator's own
   bookmark. Fragment wins over localStorage; localStorage is kept as best-effort cache. */
const frag = (() => {
  const h = location.hash.replace(/^#/, "");
  if (!h) return {};
  const p = new URLSearchParams(h);
  return {
    token: p.get("token") || p.get("t") || "",
    agent: p.get("agent") || "",
    conv: p.get("conv") || "",
  };
})();
const lsGet = (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } };
if (frag.token) lsSet(LS.token, frag.token);
if (frag.agent) lsSet(LS.agent, frag.agent);
if (frag.conv) lsSet(LS.conv, frag.conv);

const store = {
  get token() { return frag.token || lsGet(LS.token); },
  get agent() { return frag.agent || lsGet(LS.agent) || DEFAULTS.agent_id; },
  get conv() { return frag.conv || lsGet(LS.conv) || DEFAULTS.conversation_id; },
};

let ws = null;
let cursor = null;            // max journal row id seen; reconnects resume here
let backoff = 1000;
let attached = false;
let closedByUser = false;
let lastFrameAt = 0;          // any WS frame; resume logic distrusts a long-quiet socket

/* Rendering state */
const bubbles = new Map();    // delta message id -> element (streaming append)
const myCms = new Set();      // client_message_ids this surface sent (attribution)
const foreignCms = new Set();
const pendingSends = new Map(); // request_id -> bubble element

function line(text, cls) {
  const div = document.createElement("div");
  div.className = "line" + (cls ? " " + cls : "");
  div.textContent = text;
  transcript.appendChild(div);
  scrollDown();
}
/* Linkify by DOM construction — never innerHTML, so message text can never become
   markup. Bubbles keep their raw text and re-render per append because a URL can be
   SPLIT ACROSS STREAMED CHUNKS; matching only the latest chunk would miss it. */
const URL_RE = /https?:\/\/[^\s<>"']+/g;
function renderRich(el, raw) {
  el.textContent = "";
  let last = 0;
  for (const m of raw.matchAll(URL_RE)) {
    let url = m[0];
    // Trailing punctuation is usually prose; strip ")" only while they OUTNUMBER "(" —
    // so https://x/a_(b) keeps its paren but a wrapping (…) sheds the wrapper's.
    for (;;) {
      if (/[.,;:!?]$/.test(url)) { url = url.slice(0, -1); continue; }
      if (url.endsWith(")") && url.split(")").length > url.split("(").length) {
        url = url.slice(0, -1);
        continue;
      }
      break;
    }
    el.appendChild(document.createTextNode(raw.slice(last, m.index)));
    const a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = url;
    el.appendChild(a);
    last = m.index + url.length;
  }
  el.appendChild(document.createTextNode(raw.slice(last)));
}
function bubble(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div._raw = text || "";
  renderRich(div, div._raw);
  transcript.appendChild(div);
  scrollDown();
  return div;
}
function scrollDown() {
  transcript.scrollTop = transcript.scrollHeight;
}

function wsUrl() {
  const dir = location.pathname.replace(/[^/]*$/, "");
  const proto = location.protocol === "https:" ? "wss" : "ws";
  return `${proto}://${location.host}${dir}surface`;
}

function setState(s) {
  stateDot.className = s;
  sendBtn.disabled = s !== "live";
}

function connect() {
  if (!store.token) { openSettings(); return; }
  closedByUser = false;
  setState("connecting");
  // Stale sockets' handlers must be inert: resume logic can close-and-reconnect while an
  // old socket's onclose is still pending, and two live reconnect loops would stack.
  const socket = new WebSocket(wsUrl());
  ws = socket;
  socket.onopen = () => {
    if (ws !== socket) return;
    socket.send(JSON.stringify({
      type: "attach",
      token: store.token,
      protocol_version: 1,
      capabilities: ["core", "notify"],
      runtime: { agent_id: store.agent, conversation_id: store.conv },
      cursor,
    }));
  };
  socket.onmessage = (m) => {
    if (ws !== socket) return;
    lastFrameAt = Date.now();
    try { onFrame(JSON.parse(m.data)); } catch (e) { console.error(e); }
  };
  socket.onclose = () => {
    if (ws !== socket) return;
    attached = false;
    working.className = "";
    setState("down");
    if (closedByUser) return;
    setTimeout(() => { if (ws === socket) connect(); }, backoff);
    backoff = Math.min(backoff * 2, 15000);
  };
  socket.onerror = () => { /* onclose follows */ };
}

function onFrame(f) {
  switch (f.type) {
    case "attach_ok": {
      attached = true;
      backoff = 1000;
      setState("live");
      runtimeLabel.textContent = shortRuntime();
      for (const ev of f.replay || []) onEvent(ev);
      const unseen = f.unseen || [];
      if (unseen.length > 0) line(`${unseen.length} update${unseen.length > 1 ? "s" : ""} arrived while you were away ↑`, "unseen");
      sendPresence();
      refreshModelFooter();
      return;
    }
    case "attach_denied": {
      setState("down");
      closedByUser = true; // no auto-retry into the same denial
      line(`attach denied: ${f.reason || "unknown"}`, "error");
      openSettings();
      return;
    }
    case "event": return onEvent(f);
    case "send_ok": {
      myCms.add(f.client_message_id);
      const b = pendingSends.get(f.request_id);
      if (b) { b.classList.remove("pending"); pendingSends.delete(f.request_id); }
      return;
    }
    case "error": {
      const b = f.request_id ? pendingSends.get(f.request_id) : null;
      if (b) { b.classList.add("failed"); pendingSends.delete(f.request_id); }
      line(`error: ${f.message || "unknown"}`, "error");
      return;
    }
    case "foreign_event": return; // direct-lane inline render is a full-C9 feature
    default: return;              // forward-compat: tolerate unknown frames
  }
}

/* Journal event row -> transcript. Mirrors ControllerCore.onEvent. */
function onEvent(ev) {
  if (typeof ev.id === "number") cursor = Math.max(cursor ?? 0, ev.id);
  const kind = ev.kind;
  const payload = ev.payload || {};
  const cm = ev.client_message_id || null;

  if (kind === "turn_accepted") {
    if (cm && !myCms.has(cm)) foreignCms.add(cm);
    return;
  }

  const delta = payload.delta;
  if (delta && typeof delta.message_type === "string") {
    const text = deltaText(delta);
    if (text === undefined) return;
    // Chunks of one message carry DIFFERENT delta.ids (verified live — see
    // letta-terminal render.ts); the stable identity is run + message_type.
    const key = (delta.run_id || "?") + "|" + delta.message_type;
    if (delta.message_type === "user_message") {
      // My own sends already rendered optimistically; a user delta is a peer's.
      if (cm && myCms.has(cm)) return;
      appendTo(key, "peer", text);
      return;
    }
    if (delta.message_type === "assistant_message") {
      working.className = "";
      appendTo(key, "agent", text);
      return;
    }
    // Reasoning / tool traffic: collapse to the working indicator.
    working.className = "on";
    return;
  }

  if (kind === "turn_terminal") {
    working.className = "";
    const outcome = String(payload.outcome || "");
    if (outcome && outcome !== "end_turn") line(`turn ended: ${outcome}`, "error");
    return;
  }
  if (kind === "turn_failed_visible") {
    working.className = "";
    line(`turn FAILED: ${payload.reason || "unknown"}`, "error");
    return;
  }
  // turn_submitted, input_accepted, update_queue, … : bookkeeping, not rendered.
}

function appendTo(key, cls, text) {
  let b = bubbles.get(key);
  if (!b) { b = bubble(cls, ""); bubbles.set(key, b); }
  b._raw += text;
  renderRich(b, b._raw);
  scrollDown();
}

function deltaText(delta) {
  const c = delta.content;
  if (typeof c === "string") return c;
  if (Array.isArray(c)) {
    const joined = c.map((p) => (typeof p === "string" ? p : (p && p.text) || "")).join("");
    return joined === "" ? undefined : joined;
  }
  if (typeof delta.tool_return === "string") return delta.tool_return;
  return undefined;
}

function shortRuntime() {
  const a = store.agent, c = store.conv;
  const isKinara = a === DEFAULTS.agent_id;
  return (isKinara ? "kinara" : a.slice(0, 24) + "…") + " · " + c;
}

/* ---- send ---- */
el("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !attached) return;
  if (text === "/model" || text.startsWith("/model ")) {
    handleModelCommand(text.slice("/model".length).trim());
    input.value = "";
    input.style.height = "";
    return;
  }
  const request_id = crypto.randomUUID();
  const b = bubble("you pending", text);
  pendingSends.set(request_id, b);
  ws.send(JSON.stringify({ type: "send", request_id, text }));
  input.value = "";
  input.style.height = "";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    el("composer").requestSubmit();
  }
});
input.addEventListener("input", () => {
  input.style.height = "";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

/* ---- /model command ----
   `/model`        show the runtime's current model
   `/model list`   list what the server's provider config (litellm harness) can reach
   `/model <id>`   switch THIS runtime live (update_model under the hood)              */
async function handleModelCommand(arg) {
  const dir = location.pathname.replace(/[^/]*$/, "");
  try {
    if (!arg) {
      const r = await fetch(`${dir}agent-info?agent=${encodeURIComponent(store.agent)}`);
      const info = await r.json();
      line(`model · ${info.model || "?"} — /model list to enumerate, /model <id> to switch`);
      return;
    }
    if (arg === "list") {
      const r = await fetch(`${dir}models`);
      const m = await r.json();
      if (m.error) { line(`models: ${m.error}`, "error"); return; }
      const handles = (m.available_handles || [])
        .map((h) => (typeof h === "string" ? h : h && h.handle) || "")
        .filter(Boolean);
      line(handles.length ? `available: ${handles.join("  ")}` : "no models reported");
      return;
    }
    line(`switching model to ${arg}…`);
    const r = await fetch(`${dir}agent-model`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${store.token}` },
      body: JSON.stringify({ agent_id: store.agent, conversation_id: store.conv, model: arg }),
    });
    const out = await r.json();
    if (!r.ok || out.error) { line(`model switch failed: ${out.error || r.status}`, "error"); return; }
    line(`model switched · ${out.model}`);
    refreshModelFooter();
  } catch (err) {
    line(`model command failed: ${err && err.message ? err.message : err}`, "error");
  }
}

/* ---- model footer ---- */
async function refreshModelFooter() {
  const footer = el("model-footer");
  try {
    const dir = location.pathname.replace(/[^/]*$/, "");
    const r = await fetch(`${dir}agent-info?agent=${encodeURIComponent(store.agent)}`);
    const info = await r.json();
    footer.textContent = info.model ? `model · ${info.model}` : "";
  } catch {
    footer.textContent = "";
  }
}

/* ---- presence + resume liveness ----
   iOS suspends the standalone app; its socket dies SILENTLY and can still report OPEN
   on resume until TCP notices (minutes of stale transcript under a confident dot). On
   every return to the foreground, distrust the socket: reconnect if it is not OPEN,
   not attached, or has been quiet longer than the doubt window. Reconnects are
   cursor-resumed against the journal, so a false positive costs one cheap replay. */
const RESUME_DOUBT_MS = 90_000;
function sendPresence() {
  if (!attached || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: "presence", state: document.hidden ? "background" : "focused" }));
}
function ensureLive() {
  if (document.hidden) { sendPresence(); return; }
  const suspect =
    !ws || ws.readyState !== WebSocket.OPEN || !attached ||
    (lastFrameAt && Date.now() - lastFrameAt > RESUME_DOUBT_MS);
  if (suspect && !closedByUser) {
    backoff = 1000;
    setState("connecting");
    const suspectSocket = ws;
    try { ws?.close(); } catch { /* already dead */ }
    // If 400ms later the suspect socket is still current, rebuild unconditionally —
    // onclose may never fire on a half-dead (or already-closed) socket, and any timer
    // it did schedule no-ops once `ws` is replaced (socket-identity guard).
    setTimeout(() => { if (ws === suspectSocket) connect(); }, 400);
    return;
  }
  sendPresence();
}
document.addEventListener("visibilitychange", ensureLive);
window.addEventListener("pageshow", ensureLive);
window.addEventListener("focus", ensureLive);
window.addEventListener("online", ensureLive);

/* ---- settings ---- */
function openSettings() {
  el("set-token").value = store.token;
  el("set-agent").value = store.agent;
  el("set-conv").value = store.conv;
  if (!settings.open) settings.showModal();
}
el("settings-btn").addEventListener("click", openSettings);
settings.addEventListener("close", () => {
  if (settings.returnValue !== "save") return;
  lsSet(LS.token, el("set-token").value.trim());
  lsSet(LS.agent, el("set-agent").value.trim() || DEFAULTS.agent_id);
  lsSet(LS.conv, el("set-conv").value.trim() || DEFAULTS.conversation_id);
  // An explicit save outranks whatever the launch fragment carried, for this session.
  frag.token = ""; frag.agent = ""; frag.conv = "";
  // Re-attach from scratch: new runtime means the transcript no longer applies.
  transcript.textContent = "";
  bubbles.clear(); myCms.clear(); foreignCms.clear(); pendingSends.clear();
  cursor = null;
  closedByUser = true;
  if (ws && ws.readyState <= WebSocket.OPEN) ws.close();
  setTimeout(connect, 50);
});

runtimeLabel.textContent = shortRuntime();
connect();
</script>
</body>
</html>
