<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Our Foxes — Highlights</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/favicon.png" type="image/png" sizes="32x32">
  <meta name="theme-color" content="#f05a28">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Our Foxes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/static/warm-theme.css?v={{ v }}">
</head>
<body>
  <script>
    window.CURRENT_EMAIL = {{ (current_email or '')|tojson }};
    window.IS_ADMIN = {{ (is_admin or false)|tojson }};
  </script>
  <header>
    <h1>🦊 Our Foxes</h1>
    <nav>
      <a href="/live">Live</a>
      <a href="/highlights" class="active">Highlights<span id="new-count" class="nav-badge" hidden>0</span></a>
      <span class="who-am-i" id="who-am-i" hidden></span>
    </nav>
  </header>
  <main>
    <div class="tabs-row">
      <div class="tabs">
        <button class="tab active" data-bucket="pending">All</button>
        <button class="tab" data-bucket="mine">⭐ My Faves</button>
        <button class="tab" data-bucket="shared"><span class="dual-star" aria-hidden="true"></span>Group Faves</button>
        <button class="tab" data-bucket="remixes">🎬 Remixes</button>
        <button class="tab" data-bucket="demoted">🚫 No Foxes</button>
      </div>
      <div id="view-toggle" class="view-toggle" hidden>
        <button data-view="list" class="active" type="button" title="List view" aria-label="List view"><span class="material-icons">view_list</span></button>
        <button data-view="grid" type="button" title="Card view" aria-label="Card view"><span class="material-icons">grid_view</span></button>
      </div>
    </div>
    <div class="filters">
      <span class="filters-label" id="filters-label">Filter</span>
      <label>Time:
        <select id="filter-time">
          <option value="any" selected>Any</option>
          <option value="day">Day (6am–6pm)</option>
          <option value="night">Night (6pm–6am)</option>
        </select>
      </label>
      <label>Date:
        <select id="filter-date">
          <option value="">All dates</option>
          <option value="today">Today</option>
          <option value="yesterday">Yesterday</option>
          <option value="7d" selected>Last 7 days</option>
          <option value="30d">Last 30 days</option>
        </select>
      </label>
      <label>Camera:
        <select id="filter-camera">
          <option value="">All</option>
          {% for s in streams %}
          <option value="{{ s }}">{{ s }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Status:
        <select id="filter-status">
          <option value="active" selected>Active</option>
          <option value="any">All</option>
          <option value="archived">Archived</option>
        </select>
      </label>
      <label>Species:
        <select id="filter-species">
          <option value="">All</option>
          <option value="wildlife">Wildlife only</option>
          <option value="fox">Fox only</option>
          <option value="unclassified">Not yet classified</option>
        </select>
      </label>
    </div>
    <div id="highlights" class="grid"></div>
    <button id="load-more">Load more</button>
  </main>

  <!-- Card-detail modal. Opened by clicking a card; closed via the X
       button, clicking the backdrop, or ESC. The body is rebuilt by
       modal.js on every open and switches between two layouts:
         (1) viewer  — large player + meta + actions (default)
         (2) remix   — focused player + trim timeline + zoom controls -->
  <dialog id="card-modal" class="card-modal" aria-labelledby="card-modal-title">
    <!-- Close button has autofocus so the dialog's default first-
         focusable-element behavior doesn't land on the prev nav arrow
         and render a browser focus ring there. -->
    <button class="card-modal-close" type="button" aria-label="Close" autofocus>×</button>
    <!-- Replay current clip from frame 0. Spaced 1.5× the close-X
         height beneath it. -->
    <button class="card-modal-replay" type="button" aria-label="Replay from start" title="Replay from start">
      <span class="material-icons">replay</span>
    </button>
    <div class="card-modal-body" id="card-modal-body"></div>
  </dialog>
  <script src="/static/panzoom.min.js?v={{ v }}"></script>
  <script src="/static/deliverers.js?v={{ v }}"></script>
  <script src="/static/card.js?v={{ v }}"></script>
  <script src="/static/modal.js?v={{ v }}"></script>
  <script src="/static/highlights.js?v={{ v }}"></script>
  <script src="/static/easter-eggs.js?v={{ v }}"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        // Force any registered SW to fetch the latest sw.js and
        // skipWaiting+activate. Without this, a buggy older SW can
        // keep intercepting /api/* requests and breaking the page.
        navigator.serviceWorker.register("/sw.js")
          .then((reg) => reg.update())
          .catch((err) => console.error("[sw] register failed", err));
      });
    }
  </script>
</body>
</html>
