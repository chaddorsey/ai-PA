<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Our Foxes — Highlights</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/favicon.png" type="image/png" sizes="32x32">
  <meta name="theme-color" content="#f05a28">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Our Foxes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>
  <header>
    <h1>🦊 Our Foxes</h1>
    <nav>
      <a href="/live">Live</a>
      <a href="/highlights" class="active">Highlights<span id="new-count" class="nav-badge" hidden>0</span></a>
    </nav>
  </header>
  <main>
    <div class="tabs">
      <button class="tab active" data-bucket="pending">All</button>
      <button class="tab" data-bucket="mine">⭐ Mine</button>
      <button class="tab" data-bucket="shared">🌟 Shared</button>
      <button class="tab" data-bucket="demoted">🚫 No Foxes</button>
    </div>
    <div class="filters">
      <label>Time:
        <select id="filter-time">
          <option value="any" selected>Any</option>
          <option value="day">Day (6am–6pm)</option>
          <option value="night">Night (6pm–6am)</option>
        </select>
      </label>
      <label>Date:
        <select id="filter-date">
          <option value="">All dates</option>
          <option value="today">Today</option>
          <option value="yesterday">Yesterday</option>
          <option value="7d" selected>Last 7 days</option>
          <option value="30d">Last 30 days</option>
        </select>
      </label>
      <label>Camera:
        <select id="filter-camera">
          <option value="">All</option>
          {% for s in streams %}
          <option value="{{ s }}">{{ s }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Species:
        <select id="filter-species">
          <option value="">All</option>
          <option value="wildlife">Wildlife only</option>
          <option value="fox">Fox only</option>
          <option value="unclassified">Not yet classified</option>
        </select>
      </label>
    </div>
    <div id="highlights" class="grid"></div>
    <button id="load-more">Load more</button>
  </main>
  <script src="/static/deliverers.js?v={{ v }}"></script>
  <script src="/static/card.js?v={{ v }}"></script>
  <script src="/static/highlights.js?v={{ v }}"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js")
          .catch((err) => console.error("[sw] register failed", err));
      });
    }
  </script>
</body>
</html>
