<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  {% include "_ios_detect.html" %}
  <title>Our Foxes — Live</title>
  <!-- PWA: web manifest + iOS-specific meta + theme color. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/favicon.png" type="image/png" sizes="32x32">
  <meta name="theme-color" content="#f05a28">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Our Foxes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/warm-theme.css?v={{ v }}">
</head>
<body>
  <script>
    window.CURRENT_EMAIL = {{ (current_email or '')|tojson }};
    window.IS_ADMIN = {{ (is_admin or false)|tojson }};
  </script>
  <header>
    <h1>🦊 Our Foxes</h1>
    <nav>
      <a href="/live" class="active">Live</a>
      <a href="/highlights" id="nav-highlights">Highlights<span id="new-count" class="nav-badge" hidden>0</span></a>
      <span class="who-am-i" id="who-am-i" hidden></span>
    </nav>
  </header>
  <main id="live-main" class="live-layout" data-mode="grid">
    {% for stream in streams %}
    <section class="cam" data-stream="{{ stream }}">
      <h2>Fox Cam {{ stream.split('_')[-1] }}</h2>
      <div class="video-wrap">
        <!-- Two stacked video elements:
             - .grid-stream: always playing the *_sub variant (low
               bandwidth). Used for grid + thumbnail rendering and as
               the always-visible fallback while spotlight is loading.
             - .spotlight-stream: dormant until cam enters spotlight,
               then loads the main stream (full resolution for native
               zoom). Hidden until its first frame plays — at which
               point .spotlight-ready flips on the cam and CSS swaps
               which video is visible. The substream keeps playing
               throughout, so spotlight feels instant. -->
        <video class="grid-stream" id="v-{{ stream }}" data-stream="{{ stream }}_sub" autoplay muted playsinline></video>
        <video class="spotlight-stream" data-base="{{ stream }}" autoplay muted playsinline></video>
        <div class="zoom-controls" aria-hidden="true">
          <button class="zoom-btn zoom-in"  title="Zoom in"  aria-label="Zoom in">+</button>
          <button class="zoom-btn zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
          <button class="zoom-btn zoom-fit" title="Fit"      aria-label="Fit">⛶</button>
        </div>
      </div>
      <div class="status" id="s-{{ stream }}">connecting…</div>
    </section>
    {% endfor %}
  </main>
  <script src="/static/panzoom.min.js?v={{ v }}"></script>
  <script src="/static/card.js?v={{ v }}"></script>
  <script src="/static/live.js?v={{ v }}"></script>
  <script src="/static/peeks.js?v={{ v }}"></script>
  <script src="/static/easter-eggs.js?v={{ v }}"></script>
  <script>
    // Decorate /highlights nav with an unread count if there are new wildlife
    // events since the user's last visit. Badge clears on next /highlights load.
    fetch("/api/viewer/state")
      .then((r) => r.ok ? r.json() : null)
      .then((s) => {
        const b = document.getElementById("new-count");
        if (!b) return;
        if (s && s.new_count > 0) {
          b.textContent = "";   // dot only, no number
          b.title = `${s.new_count} new highlight${s.new_count === 1 ? "" : "s"}`;
          b.hidden = false;
        } else {
          b.hidden = true;
        }
      })
      .catch(() => {});
    // Service worker registration. Best-effort; failures (older browser,
    // private mode) silently degrade to a normal web page.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js")
          .catch((err) => console.error("[sw] register failed", err));
      });
    }
  </script>
</body>
</html>
