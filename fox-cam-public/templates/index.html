<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fox Cam</title>
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>
  <header>
    <h1>🦊 Fox Cam</h1>
    <nav>
      <a href="/" class="active">Live</a>
      <a href="/highlights">Highlights</a>
    </nav>
  </header>
  <main class="grid">
    {% for stream in streams %}
    <section class="cam">
      <h2>{{ stream }}</h2>
      <video id="v-{{ stream }}" data-stream="{{ stream }}" autoplay muted playsinline></video>
      <div class="status" id="s-{{ stream }}">connecting…</div>
    </section>
    {% endfor %}
  </main>
  <script src="/static/live.js?v={{ v }}"></script>
</body>
</html>
