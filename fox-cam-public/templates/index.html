<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fox Cam</title>
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>
  <header>
    <h1>🦊 Fox Cam</h1>
    <nav>
      <a href="/" class="active">Live</a>
      <a href="/highlights" id="nav-highlights">Highlights<span id="new-count" class="nav-badge" hidden>0</span></a>
    </nav>
  </header>
  <main id="live-main" class="live-layout" data-mode="grid">
    {% for stream in streams %}
    <section class="cam" data-stream="{{ stream }}">
      <h2>{{ stream }}</h2>
      <div class="video-wrap">
        <!-- Live grid uses the camera substream (704x480) for two
             reasons: (1) Dahua/Amcrest main-stream SPS reports level
             4.1 but actually pushes 4K/4MP frames, which browsers
             refuse to decode (level mismatch). (2) 4 simultaneous
             4K streams is unnecessary bandwidth for a glanceable
             dashboard. Spotlight will switch to main on demand once
             the SPS-rewrite is in place. -->
        <video id="v-{{ stream }}" data-stream="{{ stream }}_sub" autoplay muted playsinline></video>
        <div class="zoom-controls" aria-hidden="true">
          <button class="zoom-btn zoom-in"  title="Zoom in"  aria-label="Zoom in">+</button>
          <button class="zoom-btn zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
          <button class="zoom-btn zoom-fit" title="Fit"      aria-label="Fit">⛶</button>
        </div>
      </div>
      <div class="status" id="s-{{ stream }}">connecting…</div>
    </section>
    {% endfor %}
  </main>
  <script src="/static/panzoom.min.js?v={{ v }}"></script>
  <script src="/static/live.js?v={{ v }}"></script>
  <script>
    // Decorate /highlights nav with an unread count if there are new wildlife
    // events since the user's last visit. Badge clears on next /highlights load.
    fetch("/api/viewer/state")
      .then((r) => r.ok ? r.json() : null)
      .then((s) => {
        if (s && s.new_count > 0) {
          const b = document.getElementById("new-count");
          b.textContent = s.new_count;
          b.hidden = false;
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
