<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  {% include "_ios_detect.html" %}
  <title>Our Foxes — Clip</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/favicon.png" type="image/png" sizes="32x32">
  <meta name="theme-color" content="#f05a28">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Our Foxes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/warm-theme.css?v={{ v }}">
</head>
<body>
  <script>
    window.CURRENT_EMAIL = {{ (current_email or '')|tojson }};
    window.IS_ADMIN = {{ (is_admin or false)|tojson }};
  </script>
  <header>
    <h1>🦊 Our Foxes</h1>
    <nav>
      <a href="/live">Live</a>
      <a href="/highlights">Highlights</a>
      <span class="who-am-i" id="who-am-i" hidden></span>
    </nav>
  </header>
  <main class="clip-page"
        data-event-id="{{ event_id or '' }}"
        data-remix-id="{{ remix_id or '' }}"
        data-force-remix="{{ '1' if force_remix_mode else '' }}">
    <div id="clip-card" class="highlight clip-permalink" data-event-id="{{ event_id }}">
      <div class="meta loading">loading…</div>
    </div>

    <!-- Remix-mode editor: hidden by default. Activated when the
         viewer arrives with ?remix=1 (link from a favorited card) or
         clicks the "Remix this clip" button on a favorited highlight.
         The clip card above is replaced by a focused player with a
         custom trim timeline below; zoom controls overlay the video. -->
    <section id="remix-mode" class="remix-mode" hidden>
      <div class="remix-stage">
        <div class="remix-video-wrap">
          <video id="remix-video" muted playsinline></video>
          <div class="zoom-controls" aria-hidden="true">
            <button class="zoom-btn zoom-in"  title="Zoom in"  aria-label="Zoom in"><span class="material-icons">add</span></button>
            <button class="zoom-btn zoom-out" title="Zoom out" aria-label="Zoom out"><span class="material-icons">remove</span></button>
            <button class="zoom-btn zoom-fit" title="Fit"      aria-label="Fit"><span class="material-icons">crop_free</span></button>
          </div>
        </div>
        <div class="remix-controls">
          <button id="remix-playpause" type="button" class="remix-pp">▶</button>
          <span id="remix-time" class="remix-time muted">0:00 / 0:00</span>
          <span class="remix-spacer"></span>
          <span id="remix-zoom-display" class="muted small">zoom: 1.0×</span>
        </div>
        <div class="trim-track" id="trim-track">
          <div class="trim-region"></div>
          <div class="trim-handle trim-start" data-handle="start" tabindex="0"
                role="slider" aria-label="Trim start"></div>
          <div class="trim-handle trim-end" data-handle="end" tabindex="0"
                role="slider" aria-label="Trim end"></div>
          <div class="trim-playhead"></div>
        </div>
        <div class="remix-meta-row">
          <input id="remix-title" type="text" placeholder="Title (optional)" maxlength="80">
          <span id="remix-trim-display" class="muted small"></span>
        </div>
        <div class="remix-actions-row">
          <button id="remix-save" type="button" class="primary" disabled>Save Remix</button>
          <button id="remix-cancel" type="button">Cancel</button>
          <span id="remix-hint" class="muted small">
            Drag the orange handles to trim. Pinch / scroll to zoom. The save button enables once you've made a change.
          </span>
        </div>
      </div>
    </section>

    <!-- Existing remixes for this clip — shown below the player when
         not in remix mode. Hidden during remix-mode editing. -->
    <section id="remix-panel" class="remix-panel" hidden>
      <h3>Remixes <span class="muted" id="remix-count"></span></h3>
      <div id="remix-list"></div>
    </section>

    <p class="meta-note"><a href="/highlights">← back to all highlights</a></p>
  </main>
  <script src="/static/panzoom.min.js?v={{ v }}"></script>
  <script src="/static/card.js?v={{ v }}"></script>
  <script src="/static/clip.js?v={{ v }}"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js")
          .catch((err) => console.error("[sw] register failed", err));
      });
    }
  </script>
</body>
</html>
