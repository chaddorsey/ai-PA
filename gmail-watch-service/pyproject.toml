[tool.poetry]
name = "gmail-watch-service"
version = "0.1.0"
description = "Background service that monitors Gmail threads with 'Watching' label and notifies Letta Email Agent on replies"
authors = ["AI Agent <ai-agent@example.com>"]
readme = "README.md"
packages = [{ include = "gmail_watch", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.5" }
sqlalchemy = "^2.0.34"
asyncpg = "^0.29.0"
structlog = "^24.1.0"
httpx = "^0.28.1"
pydantic = "^2.9.2"
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.1"
google-cloud-pubsub = "^2.23.0"
google-auth = "^2.35.0"
google-api-python-client = "^2.149.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"
pytest-httpx = "^0.35.0"
coverage = "^7.6.2"
ruff = "^0.6.8"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
