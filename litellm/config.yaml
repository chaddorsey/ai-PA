# LiteLLM Proxy Configuration
# Routes Letta agent LLM calls for per-agent cost tracking
# Each agent gets a model alias (e.g., gpt-4.1-mini/calendar) that maps
# to the same underlying model but with that agent's dedicated OpenAI API key.
#
# Docs: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # =========================================================================
  # FALLBACK (used when no per-agent alias matches)
  # =========================================================================
  - model_name: "gpt-4.1-mini"
    litellm_params:
      model: "openai/gpt-4.1-mini"
      api_key: "os.environ/OPENAI_KEY_FALLBACK"

  - model_name: "gpt-4.1"
    litellm_params:
      model: "openai/gpt-4.1"
      api_key: "os.environ/OPENAI_KEY_FALLBACK"

  - model_name: "gpt-5-mini"
    litellm_params:
      model: "openai/gpt-5-mini"
      api_key: "os.environ/OPENAI_KEY_FALLBACK"

  - model_name: "text-embedding-3-small"
    litellm_params:
      model: "openai/text-embedding-3-small"
      api_key: "os.environ/OPENAI_KEY_FALLBACK"

  # =========================================================================
  # PER-AGENT MODEL ALIASES
  # =========================================================================

  # --- main-assistant-agent-kinara ---
  - model_name: "gpt-5-mini/kinara"
    litellm_params:
      model: "openai/gpt-5-mini"
      api_key: "os.environ/OPENAI_KEY_MAIN"

  - model_name: "gpt-5"
    litellm_params:
      model: "openai/gpt-5"
      api_key: "os.environ/OPENAI_KEY_MAIN"

  - model_name: "gpt-5.1"
    litellm_params:
      model: "openai/gpt-5.1"
      api_key: "os.environ/OPENAI_KEY_MAIN"

  - model_name: "gpt-5.2"
    litellm_params:
      model: "openai/gpt-5.2"
      api_key: "os.environ/OPENAI_KEY_MAIN"

  - model_name: "gpt-5.3-chat-latest"
    litellm_params:
      model: "openai/gpt-5.3-chat-latest"
      api_key: "os.environ/OPENAI_KEY_MAIN"

  - model_name: "gpt-5.4"
    litellm_params:
      model: "openai/gpt-5.4"
      api_key: "os.environ/OPENAI_KEY_MAIN"

  - model_name: "gpt-5.4-mini"
    litellm_params:
      model: "openai/gpt-5.4-mini"
      api_key: "os.environ/OPENAI_KEY_MAIN"

  - model_name: "gpt-5.4-nano"
    litellm_params:
      model: "openai/gpt-5.4-nano"
      api_key: "os.environ/OPENAI_KEY_MAIN"

  - model_name: "gpt-5.5"
    litellm_params:
      model: "openai/gpt-5.5"
      api_key: "os.environ/OPENAI_KEY_MAIN"

  # --- Anthropic models ---
  - model_name: "claude-sonnet-4-6"
    litellm_params:
      model: "anthropic/claude-sonnet-4-6"
      api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: "claude-opus-4-6"
    litellm_params:
      model: "anthropic/claude-opus-4-6"
      api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: "claude-haiku-4-5"
    litellm_params:
      model: "anthropic/claude-haiku-4-5-20251001"
      api_key: "os.environ/ANTHROPIC_API_KEY"

  # --- companion-sleeptime_copy (Anthropic model, but embedding goes through here) ---
  # Note: This agent uses Claude, not OpenAI for chat. Embedding only.

  # --- calendar-agent_copy ---
  - model_name: "gpt-4.1-mini/calendar"
    litellm_params:
      model: "openai/gpt-4.1-mini"
      api_key: "os.environ/OPENAI_KEY_CALENDAR"

  # --- docs-and-transcripts-agent ---
  - model_name: "gpt-4.1-mini/docs"
    litellm_params:
      model: "openai/gpt-4.1-mini"
      api_key: "os.environ/OPENAI_KEY_DOCS_TRANSCRIPTS"

  # --- email-agent ---
  - model_name: "gpt-4.1-mini/email"
    litellm_params:
      model: "openai/gpt-4.1-mini"
      api_key: "os.environ/OPENAI_KEY_EMAIL"

  # --- pulse-monitor-agent ---
  - model_name: "gpt-4.1-mini/pulse"
    litellm_params:
      model: "openai/gpt-4.1-mini"
      api_key: "os.environ/OPENAI_KEY_PULSE"

  # --- pulse-monitor-agent_copy (sleeptime) ---
  - model_name: "gpt-4.1-mini/pulse-sleep"
    litellm_params:
      model: "openai/gpt-4.1-mini"
      api_key: "os.environ/OPENAI_KEY_PULSE_SLEEPTIME"

  # --- tasks-agent ---
  - model_name: "gpt-4.1-mini/tasks"
    litellm_params:
      model: "openai/gpt-4.1-mini"
      api_key: "os.environ/OPENAI_KEY_TASKS"

  # --- tasks-agent-sleeptime ---
  - model_name: "gpt-4.1-mini/tasks-sleep"
    litellm_params:
      model: "openai/gpt-4.1-mini"
      api_key: "os.environ/OPENAI_KEY_TASKS_SLEEPTIME"

  # --- daily-schedule-agent-sleeptime ---
  - model_name: "gpt-4.1-mini/schedule"
    litellm_params:
      model: "openai/gpt-4.1-mini"
      api_key: "os.environ/OPENAI_KEY_MAIN_SLEEPTIME"

  # --- sports_and_media_maven ---
  - model_name: "gpt-4.1-mini/media"
    litellm_params:
      model: "openai/gpt-4.1-mini"
      api_key: "os.environ/OPENAI_KEY_MEDIA"

  # --- sports_and_media_maven_sleeptime ---
  - model_name: "gpt-4.1-mini/media-sleep"
    litellm_params:
      model: "openai/gpt-4.1-mini"
      api_key: "os.environ/OPENAI_KEY_MEDIA_SLEEPTIME"

  # --- rover ---
  - model_name: "gpt-4.1-mini/rover"
    litellm_params:
      model: "openai/gpt-4.1-mini"
      api_key: "os.environ/OPENAI_KEY_ROVER"

  # --- old/archived agents ---
  - model_name: "gpt-4.1-mini/old"
    litellm_params:
      model: "openai/gpt-4.1-mini"
      api_key: "os.environ/OPENAI_KEY_OLD_AGENTS"

  - model_name: "gpt-4.1/old"
    litellm_params:
      model: "openai/gpt-4.1"
      api_key: "os.environ/OPENAI_KEY_OLD_AGENTS"

  # =========================================================================
  # FIREWORKS AI (open-weights models, routed via LiteLLM for per-alias
  # cost tracking). Enabled when FIREWORKS_AI_API_KEY is set in .env.
  # Full path format: fireworks_ai/accounts/fireworks/models/<name>
  # Verified against the account's serverless catalog on 2026-04-22.
  # =========================================================================

  # --- DeepSeek (v3.x retired from Fireworks serverless 2026-05;
  #      v4-pro is the current serverless flagship — defined below) ---

  # --- Kimi K2.6 (Moonshot; latest, not in /v1/models listing but live) ---
  - model_name: "kimi-k2p6"
    litellm_params:
      model: "fireworks_ai/accounts/fireworks/models/kimi-k2p6"
      api_key: "os.environ/FIREWORKS_AI_API_KEY"

  - model_name: "kimi-k2p5"
    litellm_params:
      model: "fireworks_ai/accounts/fireworks/models/kimi-k2p5"
      api_key: "os.environ/FIREWORKS_AI_API_KEY"

  # --- GLM-5.1 (Zhipu; leads SWE-bench Pro, strong agentic coding;
  #     glm-5 base was retired from Fireworks serverless 2026-05) ---
  - model_name: "glm-5p1"
    litellm_params:
      model: "fireworks_ai/accounts/fireworks/models/glm-5p1"
      api_key: "os.environ/FIREWORKS_AI_API_KEY"

  # --- GLM-5.2 (Zhipu; newer than 5.1, via Fireworks serverless) ---
  - model_name: "glm-5p2"
    litellm_params:
      model: "fireworks_ai/accounts/fireworks/models/glm-5p2"
      api_key: "os.environ/FIREWORKS_AI_API_KEY"

  # --- MiniMax M2.7 (strong reasoning, long context) ---
  - model_name: "minimax-m2p7"
    litellm_params:
      model: "fireworks_ai/accounts/fireworks/models/minimax-m2p7"
      api_key: "os.environ/FIREWORKS_AI_API_KEY"

  # --- OpenAI open-weight GPT-OSS 120B ---
  - model_name: "gpt-oss-120b"
    litellm_params:
      model: "fireworks_ai/accounts/fireworks/models/gpt-oss-120b"
      api_key: "os.environ/FIREWORKS_AI_API_KEY"

  # --- DeepSeek V4 Pro (latest reasoning model on Fireworks) ---
  - model_name: "deepseek-v4-pro"
    litellm_params:
      model: "fireworks_ai/accounts/fireworks/models/deepseek-v4-pro"
      api_key: "os.environ/FIREWORKS_AI_API_KEY"

  # =========================================================================
  # GOOGLE (Gemini) — vision-capable, used by fox-cam classifier (Track 1)
  # =========================================================================

  - model_name: "gemini-2.0-flash"
    litellm_params:
      model: "gemini/gemini-2.0-flash"
      api_key: "os.environ/GEMINI_API_KEY"

  - model_name: "gemini-2.5-flash"
    litellm_params:
      model: "gemini/gemini-2.5-flash"
      api_key: "os.environ/GEMINI_API_KEY"

  # =========================================================================
  # FOX-CAM CLASSIFIER aliases (Track 1) — same models, scoped name for
  # cost attribution.
  # =========================================================================

  - model_name: "gpt-4o-mini/fox-cam"
    litellm_params:
      model: "openai/gpt-4o-mini"
      api_key: "os.environ/OPENAI_KEY_FALLBACK"

  - model_name: "gemini-2.0-flash/fox-cam"
    litellm_params:
      model: "gemini/gemini-2.0-flash"
      api_key: "os.environ/GEMINI_API_KEY"

litellm_settings:
  drop_params: true
  request_timeout: 120
  success_callback: ["db"]
  failure_callback: ["db"]
  # Cross-provider compatibility hook — strips reasoning_content_signature
  # and similar provider-specific fields when targeting strict providers
  # (Kimi/DeepSeek/GLM/MiniMax/gpt-oss on Fireworks). See
  # litellm/hooks/cross_provider_compat.py for the full taxonomy.
  callbacks: hooks.cross_provider_compat.proxy_handler_instance

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/LITELLM_DATABASE_URL"
  alerting: []
